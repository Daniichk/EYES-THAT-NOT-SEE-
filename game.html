<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>LLAMA VANGUARD | ULTIMATE</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --neon: #00ff87;
            --neon-alt: #60efff;
            --bg: #020205;
            --glass: rgba(255, 255, 255, 0.03);
            --glow: 0 0 20px rgba(0, 255, 135, 0.3);
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Inter', sans-serif; overflow: hidden;
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        /* --- ВЕРХНИЙ ИНТЕРФЕЙС --- */
        #hud {
            position: absolute; top: 40px; text-align: center; z-index: 100;
            pointer-events: none;
        }
        #score {
            font-family: 'Orbitron', sans-serif; font-size: 5.5rem; margin: 0;
            background: linear-gradient(to bottom, #fff, var(--neon));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(var(--glow));
        }
        .multiplier { font-weight: 800; color: var(--neon-alt); letter-spacing: 2px; }

        /* --- ЦЕНТРАЛЬНЫЙ ОБЪЕКТ --- */
        #stage {
            position: relative; width: 400px; height: 400px;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }
        #llama-main {
            font-size: 180px; cursor: pointer; z-index: 10;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 30px rgba(0,255,135,0.2));
            user-select: none;
        }
        #llama-main:active { transform: scale(0.8) rotate(-5deg); }

        /* --- ОРБИТЫ (ОРБИТАЛЬНЫЕ КРУГИ) --- */
        .orbit-ring {
            position: absolute; border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%; pointer-events: none;
        }
        .satellite {
            position: absolute; font-size: 24px;
            animation: rotate var(--speed) linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg) translate(var(--radius)) rotate(0deg); }
            to { transform: rotate(360deg) translate(var(--radius)) rotate(-360deg); }
        }

        /* --- ПАНЕЛИ МАГАЗИНА --- */
        .panel {
            position: absolute; background: var(--glass);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px; border-radius: 35px; width: 320px;
            max-height: 80vh; overflow-y: auto; z-index: 50;
        }
        #shop { right: 30px; }
        #inventory { left: 30px; }

        .card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            padding: 18px; border-radius: 22px; margin-bottom: 12px;
            cursor: pointer; transition: 0.3s;
        }
        .card:hover { 
            background: rgba(0, 255, 135, 0.08); border-color: var(--neon);
            transform: translateX(-5px);
        }
        .card h4 { margin: 0; font-size: 1rem; }
        .card p { margin: 5px 0 0; font-size: 0.75rem; color: var(--neon-alt); font-weight: 700; }

        /* --- ЭФФЕКТЫ КЛИКА --- */
        .click-ghost {
            position: absolute; pointer-events: none; font-size: 100px;
            animation: ghostOut 0.6s ease-out forwards; opacity: 0.5; z-index: 5;
        }
        @keyframes ghostOut {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .pop-num {
            position: absolute; pointer-events: none; font-family: 'Orbitron';
            font-weight: 900; animation: popUp 0.7s forwards; z-index: 1000;
        }
        @keyframes popUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
        }

        /* Frenzy Mode Effect */
        body.frenzy { background: radial-gradient(circle, #200 0%, #020205 100%); }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="hud">
    <div class="multiplier" id="mult-text">COMBO X1</div>
    <h1 id="score">0</h1>
    <div style="font-size: 0.7rem; letter-spacing: 3px; opacity: 0.5;">POWER PER SECOND: <span id="lps">0</span></div>
</div>

<div id="inventory" class="panel">
    <h3 style="color: var(--neon-alt); font-size: 0.8rem; letter-spacing: 2px;">COLLECTIBLES</h3>
    <div id="ach-list"></div>
</div>

<div id="stage">
    <!-- Орбиты будут создаваться здесь -->
    <div id="llama-main" onclick="handleTap(event)">🦙</div>
</div>

<div id="shop" class="panel">
    <h3 style="color: var(--neon); font-size: 0.8rem; letter-spacing: 2px;">UPGRADES</h3>
    <div id="shop-list"></div>
    <button onclick="evolve()" style="width:100%; padding:15px; border-radius:20px; background:var(--neon); border:none; font-weight:800; margin-top:10px; cursor:pointer;">EVOLVE REALITY (10k)</button>
</div>

<script>
    let score = 0, lps = 0, combo = 1, lastClick = 0, dimension = 1;
    let currentEmoji = '🦙';

    const items = [
        { id: 'c1', n: 'Quantum Mouse', c: 20, p: 1, e: '⚡' },
        { id: 'c2', n: 'Neural Link', c: 200, p: 8, e: '🧠' },
        { id: 'c3', n: 'Star Server', c: 1500, p: 40, e: '🌌' },
        { id: 'c4', n: 'Time Bender', c: 10000, p: 250, e: '⏳' }
    ];

    const skins = [
        { r: 100, e: '🤖', n: 'Cybernetic' },
        { r: 5000, e: '🥷', n: 'Shadow' },
        { r: 50000, e: '👑', n: 'Overlord' }
    ];

    function handleTap(e) {
        // Комбо логика
        let now = Date.now();
        if (now - lastClick < 300) combo = Math.min(combo + 0.1, 5);
        else combo = 1;
        lastClick = now;

        let gain = dimension * Math.floor(combo);
        score += gain;

        // Визуальные эффекты
        spawnEffect(e.clientX, e.clientY, `+${gain}`);
        ghostLlama();
        
        // Frenzy эффект
        if (combo > 3) document.body.classList.add('frenzy');
        else document.body.classList.remove('frenzy');

        updateUI();
        checkSkins();
    }

    function spawnEffect(x, y, txt) {
        const n = document.createElement('div');
        n.className = 'pop-num';
        n.innerText = txt;
        n.style.left = x + 'px'; n.style.top = y + 'px';
        n.style.color = combo > 2 ? '#ff4d4d' : 'var(--neon)';
        document.body.appendChild(n);
        setTimeout(() => n.remove(), 700);
    }

    function ghostLlama() {
        const g = document.createElement('div');
        g.className = 'click-ghost';
        g.innerText = currentEmoji;
        document.getElementById('stage').appendChild(g);
        setTimeout(() => g.remove(), 600);
    }

    function createSatellite(emoji) {
        const radius = 120 + (Math.random() * 80);
        const speed = 3 + (Math.random() * 10);
        const sat = document.createElement('div');
        sat.className = 'satellite';
        sat.innerText = emoji;
        sat.style.setProperty('--radius', `${radius}px`);
        sat.style.setProperty('--speed', `${speed}s`);
        document.getElementById('stage').appendChild(sat);
    }

    function buy(idx) {
        let it = items[idx];
        if (score >= it.c) {
            score -= it.c;
            lps += it.p;
            it.c *= 1.6;
            createSatellite(it.e);
            renderShop();
            updateUI();
        }
    }

    function renderShop() {
        document.getElementById('shop-list').innerHTML = items.map((it, i) => `
            <div class="card" onclick="buy(${i})">
                <h4>${it.e} ${it.n}</h4>
                <p>COST: ${Math.floor(it.c)} | +${it.p} LPS</p>
            </div>
        `).join('');
    }

    function checkSkins() {
        skins.forEach(s => {
            if (score >= s.r && currentEmoji !== s.e) {
                currentEmoji = s.e;
                document.getElementById('llama-main').innerText = s.e;
                document.getElementById('ach-list').innerHTML += `
                    <div class="card" style="border-color:var(--neon-alt)">
                        <h4>${s.e} UNLOCKED</h4>
                        <p>${s.n} Form</p>
                    </div>`;
            }
        });
    }

    function updateUI() {
        document.getElementById('score').innerText = Math.floor(score).toLocaleString();
        document.getElementById('lps').innerText = lps.toFixed(1);
        document.getElementById('mult-text').innerText = `COMBO X${combo.toFixed(1)}`;
    }

    // Секретный код
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape') window.location.href = 'index.html';
        if (e.ctrlKey && e.shiftKey && e.key === '6') score += 100000;
    });

    setInterval(() => { score += lps/10; updateUI(); }, 100);
    renderShop();
</script>

</body>
</html>
