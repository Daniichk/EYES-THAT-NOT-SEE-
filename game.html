<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama Evolution: Cyber Clicker</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff87;
            --neon-blue: #60efff;
            --neon-purple: #bd00ff;
            --bg-dark: #08080e;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            user-select: none;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #08080e 100%);
        }

        /* --- TOP STATS --- */
        #header {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
        }

        #count {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to bottom, #fff, var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .stats-row {
            color: var(--neon-blue);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* --- GAME OBJECT --- */
        #game-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #llama-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #llama-wrapper img, #llama-wrapper .main-emoji {
            font-size: 180px;
            filter: drop-shadow(0 0 20px rgba(0,255,135,0.3));
        }

        #llama-wrapper:active { transform: scale(0.92) rotate(3deg); }

        /* --- UI PANELS --- */
        .ui-panel {
            position: absolute;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #shop { right: 25px; top: 25px; width: 280px; height: 85vh; overflow-y: auto; }
        #casino { left: 25px; top: 25px; width: 260px; }

        h3 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 0.8rem; 
            color: var(--neon-green); 
            margin-top: 0;
            border-bottom: 1px solid rgba(0,255,135,0.2);
            padding-bottom: 10px;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .btn:hover { background: var(--accent-glow); border-color: var(--neon-green); }
        .btn span.price { color: var(--neon-green); font-size: 0.8rem; }

        /* --- ANIMATIONS --- */
        .click-num {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            color: white;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
        }

        .orbit-item {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }

        /* --- PROGRESS BAR --- */
        #progress-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            box-shadow: 0 0 15px var(--neon-green);
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div id="header">
    <h2 id="count">0</h2>
    <div class="stats-row">
        LPS: <span id="lps">0</span> • DIMENSION: <span id="dim">1</span>
    </div>
</div>

<div id="game-container">
    <div id="casino" class="ui-panel">
        <h3>🎰 NEON CASINO</h3>
        <input type="number" id="bet-amt" placeholder="Amount..." style="width:100%; background:none; border:1px solid #333; color:white; padding:8px; border-radius:8px; margin-bottom:10px;">
        <button class="btn" onclick="coinflip()" style="width:100%; background:var(--neon-purple); border:none;">Double or Nothing</button>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn" onclick="spin('red')" style="flex:1; border-color:#ff4d4d">RED</button>
            <button class="btn" onclick="spin('black')" style="flex:1; border-color:#333">BLACK</button>
        </div>
        <button class="btn" onclick="login()" style="margin-top:20px; font-size: 0.6rem; opacity: 0.3;">ADMIN BYPASS</button>
    </div>

    <div id="shop" class="ui-panel">
        <h3 id="shop-name">🛒 UPGRADES</h3>
        <div id="shop-items"></div>
        <button class="btn" onclick="changeDim()" style="margin-top:20px; background:var(--neon-blue); color:black;">EVOLVE DIMENSION (10k)</button>
    </div>

    <div id="llama-wrapper" onclick="clickLlama(event)">
        <div class="main-emoji">🦙</div>
    </div>
</div>

<div id="progress-container">
    <div id="progress-fill"></div>
</div>

<script>
    let score = 0, lps = 0, dimension = 1, isAdmin = false;
    let ownedItems = {};

    const itemData = {
        1: { cursor: { name: "Cyber Click", cost: 10, power: 0.2, emoji: '⚡', r: 120 }, pen: { name: "Nano Farm", cost: 100, power: 1, emoji: '🔋', r: 150 } },
        2: { taxi: { name: "Neon Taxi", cost: 500, power: 5, emoji: '🚕', r: 180 }, drone: { name: "Delivery Drone", cost: 2000, power: 15, emoji: '🛸', r: 210 } },
        3: { server: { name: "AI Server", cost: 5000, power: 50, emoji: '🖥️', r: 240 }, matrix: { name: "Data Center", cost: 20000, power: 150, emoji: '🏢', r: 270 } },
        4: { station: { name: "Moon Base", cost: 100000, power: 800, emoji: '🌑', r: 300 }, dyson: { name: "Dyson Sphere", cost: 500000, power: 3500, emoji: '☀️', r: 340 } },
        5: { god: { name: "Reality Warper", cost: 5000000, power: 50000, emoji: '💎', r: 380 }, multi: { name: "Multiverse", cost: 100000000, power: 999999, emoji: '🌌', r: 420 } }
    };

    // --- ESCAPE TO MENU ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape') window.location.href = 'index.html';
    });

    function login() {
        if (prompt("Enter Access Code:") === "147147dan,.147147dan,") {
            isAdmin = true; score = 1000000000; dimension = 5;
            updateUI(); renderShop();
        }
    }

    function clickLlama(e) {
        let gain = isAdmin ? 1000000 : dimension;
        score += gain;
        showNum(e.clientX, e.clientY, gain);
        updateUI();
        
        // Масштабирование при клике
        document.getElementById('llama-wrapper').style.transform = 'scale(0.9)';
        setTimeout(() => { document.getElementById('llama-wrapper').style.transform = 'scale(1)'; }, 50);
    }

    function showNum(x, y, val) {
        const n = document.createElement('div');
        n.className = 'click-num';
        n.innerText = '+' + val;
        n.style.left = (x - 20) + 'px';
        n.style.top = (y - 20) + 'px';
        document.body.appendChild(n);
        setTimeout(() => n.remove(), 800);
    }

    function renderShop() {
        const container = document.getElementById('shop-items');
        container.innerHTML = "";
        for (let k in itemData[dimension]) {
            let it = itemData[dimension][k];
            container.innerHTML += `
                <button class="btn" onclick="buy('${k}')">
                    <span>${it.emoji} ${it.name}</span>
                    <span class="price">${Math.floor(it.cost)}</span>
                </button>`;
        }
    }

    function buy(id) {
        let it = itemData[dimension][id];
        if (score >= it.cost || isAdmin) {
            if (!isAdmin) score -= it.cost;
            lps += it.power;
            it.cost *= 1.4;
            createOrbit(it);
            renderShop();
            updateUI();
        }
    }

    function createOrbit(it) {
        const el = document.createElement('div');
        el.className = 'orbit-item';
        el.innerText = it.emoji;
        document.getElementById('llama-wrapper').appendChild(el);
        let angle = Math.random() * Math.PI * 2;
        let speed = 0.01 + Math.random() * 0.02;
        function anim() {
            angle += speed;
            el.style.left = (Math.cos(angle) * it.r + 130) + 'px';
            el.style.top = (Math.sin(angle) * it.r + 130) + 'px';
            requestAnimationFrame(anim);
        }
        anim();
    }

    function updateUI() {
        document.getElementById('count').innerText = Math.floor(score).toLocaleString();
        document.getElementById('lps').innerText = lps.toFixed(1);
        document.getElementById('dim').innerText = dimension;
        
        // Обновление прогресс-бара до перехода (цель 10к)
        let prog = (score / 10000) * 100;
        document.getElementById('progress-fill').style.width = Math.min(prog, 100) + '%';
    }

    function changeDim() {
        if (score >= 10000 && dimension < 5) {
            score -= 10000;
            dimension++;
            renderShop();
            updateUI();
            alert("DIMENSION " + dimension + " REACHED!");
        }
    }

    // Auto-clicker logic
    setInterval(() => {
        score += lps / 10;
        updateUI();
    }, 100);

    renderShop();
    updateUI();
</script>

</body>
</html>
