<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LLAMA VANGUARD: OVERLORD EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;400;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffbd; --accent: #ff007a; --gold: #ffcc00; --bg: #050508;
            --glass: rgba(15, 15, 25, 0.8); --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Inter', sans-serif; overflow: hidden;
            height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 50%, #111 0%, #050508 100%);
        }

        /* ACHIEVEMENT NOTIFICATION */
        #notif-container {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .notif {
            background: var(--glass); border: 2px solid var(--neon);
            padding: 15px 25px; border-radius: 15px; display: flex; align-items: center;
            gap: 15px; animation: slideIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            box-shadow: 0 0 30px rgba(0, 255, 189, 0.3);
        }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
        .notif-icon { font-size: 2rem; }
        .notif-text b { display: block; color: var(--neon); font-family: 'Orbitron'; font-size: 0.8rem; }

        /* HEADER & SCORE */
        header { padding: 40px 20px 20px; text-align: center; position: relative; }
        #rank-badge { 
            background: var(--accent); color: white; padding: 5px 20px; border-radius: 50px;
            font-family: 'Orbitron'; font-size: 0.7rem; font-weight: 900;
            box-shadow: 0 0 20px var(--accent); margin-bottom: 15px; display: inline-block;
        }
        #score {
            font-family: 'Orbitron'; font-size: 5rem; margin: 0; font-weight: 900;
            background: linear-gradient(180deg, #fff, var(--neon));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0,255,189,0.3));
        }

        /* COMBO SYSTEM */
        #combo-meter {
            position: absolute; left: 50%; transform: translateX(-50%);
            top: 160px; font-family: 'Orbitron'; color: var(--accent);
            font-size: 1.5rem; font-weight: 900; opacity: 0; transition: 0.2s;
        }

        /* LAYOUT */
        .main-grid {
            display: grid; grid-template-columns: 340px 1fr 340px;
            gap: 20px; padding: 0 20px 20px; height: calc(100vh - 220px);
            width: 100%; box-sizing: border-box;
        }
        .panel {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 30px;
            padding: 20px; overflow: hidden; display: flex; flex-direction: column;
        }
        .scrollable { overflow-y: auto; flex: 1; padding-right: 5px; }
        .scrollable::-webkit-scrollbar { width: 0; }

        /* AURA SYSTEM (THE FLEX) */
        #llama-zone { display: flex; justify-content: center; align-items: center; position: relative; }
        #aura {
            position: absolute; width: 350px; height: 350px; border-radius: 50%;
            background: radial-gradient(circle, var(--neon) 0%, transparent 70%);
            opacity: 0.2; filter: blur(40px); transition: 1s; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.2; } 50% { transform: scale(1.2); opacity: 0.4; } }
        #llama-main { font-size: 180px; cursor: pointer; user-select: none; z-index: 10; transition: 0.05s; }
        #llama-main:active { transform: scale(0.85) rotate(5deg); }

        /* SHOP & ACHIEVEMENTS */
        .card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 15px; padding: 15px; margin-bottom: 10px; cursor: pointer;
            transition: 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .card:hover { border-color: var(--neon); background: rgba(0,255,189,0.05); }
        .locked { opacity: 0.2; cursor: not-allowed; }

        .btn {
            background: var(--neon); color: #000; border: none; padding: 15px;
            border-radius: 15px; font-weight: 900; cursor: pointer; font-family: 'Orbitron';
            width: 100%; box-shadow: 0 10px 20px rgba(0,255,189,0.2);
        }

        /* TEXT FLOAT ANIMATION */
        .f-text {
            position: fixed; pointer-events: none; font-family: 'Orbitron';
            font-weight: 900; z-index: 1000; animation: float 0.7s ease-out forwards;
        }
        @keyframes float { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px) scale(1.5); } }

        .frenzy { animation: shake 0.1s infinite !important; color: var(--accent) !important; }
        @keyframes shake { 0% { margin-left: 0; } 25% { margin-left: 5px; } 50% { margin-left: 0; } 75% { margin-left: -5px; } }
    </style>
</head>
<body>

<div id="notif-container"></div>

<header id="header">
    <div id="rank-badge">UNRANKED</div>
    <h1 id="score">0</h1>
    <div id="combo-meter">COMBO X1</div>
    <div style="font-family:'Orbitron'; color:var(--neon); font-size:0.7rem; margin-top:10px;">
        POWER: <span id="lps-val">0</span> LP/S | MULT: <span id="mult-val">1.0</span>x
    </div>
</header>

<div class="main-grid">
    <div class="panel">
        <h2 style="font-family:'Orbitron'; font-size:0.8rem; color:var(--accent);">🎰 RISK ZONE</h2>
        <div class="scrollable">
            <button class="btn" style="background:var(--accent); color:white; margin-bottom:15px;" onclick="allIn()">ALL IN (50/50)</button>
            <div class="card" onclick="gambleRoulette('red')" style="border-left:5px solid #ff0055;">
                <b>RED NEON</b> <span>x2.5</span>
            </div>
            <div class="card" onclick="playTower()">
                <b>TOWER CLIMB</b> <span>x50</span>
            </div>
        </div>
        <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:10px;">
            <h2 style="font-family:'Orbitron'; font-size:0.7rem;">🏆 ACHIEVEMENTS</h2>
            <div id="ach-list" class="scrollable" style="height:150px;"></div>
        </div>
    </div>

    <div id="llama-zone">
        <div id="aura"></div>
        <div id="llama-main" onclick="tap(event)">🦙</div>
    </div>

    <div class="panel">
        <h2 style="font-family:'Orbitron'; font-size:0.8rem; color:var(--neon);">⚡ UPGRADES</h2>
        <div id="shop-list" class="scrollable"></div>
    </div>
</div>

<script>
    let state = {
        score: 0, lps: 0, mult: 1, 
        clicks: 0, combo: 0, lastClick: 0,
        unlockedAch: []
    };

    const upgrades = [
        { id: 0, n: "Click Booster", c: 15, p: 0.5, i: "🖱️" },
        { id: 1, n: "Llama Bot", c: 100, p: 4, i: "🤖" },
        { id: 2, n: "Neon Farm", c: 1000, p: 25, i: "🏭" },
        { id: 3, n: "Hype Reactor", c: 10000, p: 150, i: "🚀" },
        { id: 4, n: "God Mode AI", c: 100000, p: 1200, i: "🌌" }
    ];

    const achs = [
        { id: 'c100', n: "Fast Hands", d: "100 Clicks", req: () => state.clicks >= 100, bonus: 0.1 },
        { id: 's1000', n: "First K", d: "Reach 1,000", req: () => state.score >= 1000, bonus: 0.2 },
        { id: 's1m', n: "Millionaire", d: "Reach 1M", req: () => state.score >= 1000000, bonus: 1.0 },
        { id: 'cb50', n: "Insane Combo", d: "Reach x50 Combo", req: () => state.combo >= 50, bonus: 0.5 }
    ];

    const ranks = [
        { n: "BROKE", req: 0, color: "#aaa" },
        { n: "HUSTLER", req: 1000, color: "#00ffbd" },
        { n: "BALLER", req: 50000, color: "#ff007a" },
        { n: "OVERLORD", req: 1000000, color: "#ffcc00" },
        { n: "LLAMA GOD", req: 100000000, color: "#fff" }
    ];

    function tap(e) {
        let now = Date.now();
        if (now - state.lastClick < 300) {
            state.combo++;
        } else {
            state.combo = 0;
        }
        state.lastClick = now;

        // Combo Logic
        let comboMult = 1 + (state.combo * 0.05);
        let gain = 1 * state.mult * comboMult;
        state.score += gain;
        state.clicks++;

        // Frenzy mode
        if (state.combo > 20) {
            document.getElementById('header').classList.add('frenzy');
            document.getElementById('combo-meter').style.opacity = 1;
            document.getElementById('combo-meter').innerText = `COMBO X${state.combo} (HOT!)`;
        } else {
            document.getElementById('header').classList.remove('frenzy');
            document.getElementById('combo-meter').style.opacity = state.combo > 5 ? 1 : 0;
            document.getElementById('combo-meter').innerText = `COMBO X${state.combo}`;
        }

        spawnText(e.clientX, e.clientY, `+${gain.toFixed(1)}`);
        update();
    }

    function update() {
        document.getElementById('score').innerText = Math.floor(state.score).toLocaleString();
        document.getElementById('lps-val').innerText = (state.lps * state.mult).toFixed(1);
        document.getElementById('mult-val').innerText = state.mult.toFixed(1);

        // Update Rank & Aura
        let r = ranks[0];
        ranks.forEach(rank => { if(state.score >= rank.req) r = rank; });
        const rb = document.getElementById('rank-badge');
        rb.innerText = r.n;
        rb.style.background = r.color;
        document.getElementById('aura').style.background = `radial-gradient(circle, ${r.color} 0%, transparent 70%)`;

        // Achievements check
        achs.forEach(a => {
            if(!state.unlockedAch.includes(a.id) && a.req()) {
                state.unlockedAch.push(a.id);
                state.mult += a.bonus;
                notify(a.n, a.d);
            }
        });

        // Render Lists
        renderShop();
        renderAchs();
    }

    function renderShop() {
        document.getElementById('shop-list').innerHTML = upgrades.map(u => `
            <div class="card ${state.score < u.c ? 'locked' : ''}" onclick="buy(${u.id})">
                <div><b>${u.i} ${u.n}</b><br><small>Cost: ${u.c.toLocaleString()}</small></div>
                <div style="color:var(--neon); font-weight:900;">+${u.p}</div>
            </div>
        `).join('');
    }

    function renderAchs() {
        document.getElementById('ach-list').innerHTML = achs.map(a => `
            <div class="card" style="opacity: ${state.unlockedAch.includes(a.id) ? 1 : 0.1}">
                <div style="font-size:0.7rem;"><b>${a.n}</b><br>${a.d}</div>
                <div style="color:var(--gold)">+${(a.bonus*100)}%</div>
            </div>
        `).join('');
    }

    function buy(id) {
        let u = upgrades[id];
        if(state.score >= u.c) {
            state.score -= u.c;
            state.lps += u.p;
            u.c = Math.floor(u.c * 1.5);
            update();
        }
    }

    function notify(title, desc) {
        const container = document.getElementById('notif-container');
        const n = document.createElement('div');
        n.className = 'notif';
        n.innerHTML = `<div class="notif-icon">🏆</div><div class="notif-text"><b>${title}</b>${desc}</div>`;
        container.appendChild(n);
        setTimeout(() => n.remove(), 4000);
    }

    function spawnText(x, y, txt) {
        const div = document.createElement('div');
        div.className = 'f-text';
        div.style.left = x + 'px'; div.style.top = y + 'px';
        div.style.color = state.combo > 20 ? 'var(--accent)' : 'var(--neon)';
        div.innerText = txt;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 700);
    }

    // GAMBLE
    function allIn() {
        if(confirm("ALL IN? Real legends don't hesitate.")) {
            if(Math.random() > 0.5) {
                state.score *= 2;
                notify("JACKPOT", "Doubled your life savings!");
            } else {
                state.score = 0;
                notify("RIP", "Back to zero, kid.");
            }
            update();
        }
    }

    setInterval(() => {
        state.score += (state.lps * state.mult) / 10;
        update();
    }, 100);

    update();
</script>
</body>
</html>
