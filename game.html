<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LLAMA VANGUARD: OMNIVERSE EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffcc; --accent: #ff0055; --gold: #ffd700; --bg: #050508;
            --glass: rgba(15, 15, 25, 0.85); --border: rgba(0, 255, 204, 0.2);
        }
        body {
            margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif;
            overflow: hidden; height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 100%, #1a0033 0%, var(--bg) 80%);
            transition: filter 0.2s;
        }
        /* CRT & FX */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 999; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }
        header { padding: 15px; text-align: center; z-index: 100; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.3); }
        #score {
            font-family: 'Orbitron'; font-size: 3.5rem; margin: 0; font-weight: 900;
            background: linear-gradient(180deg, #fff, var(--neon));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0,255,204,0.4));
        }
        .main-grid {
            display: grid; grid-template-columns: 420px 1fr 420px; gap: 20px;
            padding: 15px; height: calc(100vh - 150px); box-sizing: border-box; z-index: 10;
        }
        .panel { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; }
        .tab-nav { display: flex; background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: #555; font-family: 'Orbitron'; font-weight: 900; font-size: 0.7rem; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: var(--neon); background: rgba(0,255,204,0.1); box-shadow: inset 0 -3px 0 var(--neon); }
        .tab-content { display: none; padding: 15px; overflow-y: auto; flex: 1; }
        .tab-content.active { display: block; }

        #stage { display: flex; justify-content: center; align-items: center; position: relative; }
        #llama-main { font-size: 160px; cursor: pointer; user-select: none; z-index: 10; transition: transform 0.05s; filter: drop-shadow(0 0 20px rgba(0,0,0,0.5)); }
        #aura { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, var(--neon) 0%, transparent 70%); opacity: 0.1; filter: blur(40px); }

        .game-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 12px; margin-bottom: 10px; }
        .btn { background: var(--neon); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: 900; font-family: 'Orbitron'; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 5px; font-size: 0.8rem; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; cursor: pointer; }
        .card:hover { border-color: var(--neon); background: rgba(0,255,204,0.05); }
        .card.locked { opacity: 0.2; pointer-events: none; }
        .b-icon { font-size: 1.8rem; margin-right: 12px; }
        .b-info { flex: 1; }
        .b-info b { display: block; font-family: 'Orbitron'; color: var(--neon); font-size: 0.8rem; }
        
        /* Mines & Slots UI */
        .mines-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 10px 0; }
        .mine-cell { background: #111; height: 40px; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #222; }
        .slots-row { display: flex; justify-content: center; gap: 10px; margin: 10px 0; font-size: 2rem; }
        .slot-item { background: #111; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--border); }

        /* Animations */
        @keyframes rage { 0% { transform: translate(0,0) scale(1); filter: hue-rotate(0deg); } 25% { transform: translate(5px,-5px) scale(1.02); filter: hue-rotate(90deg); } 50% { transform: translate(-5px,5px) scale(1.01); filter: hue-rotate(180deg); } 100% { transform: translate(0,0) scale(1); filter: hue-rotate(360deg); } }
        .rage-mode { animation: rage 0.1s infinite; }
        #notif { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 2px solid var(--gold); padding: 12px 25px; border-radius: 50px; z-index: 10000; transition: 0.4s; display: flex; align-items: center; gap: 10px; }
        #notif.show { top: 20px; }
    </style>
</head>
<body id="game-body">

<div id="notif"><span id="n-icon">🏆</span> <div style="font-family:'Orbitron'"><b id="n-title" style="color:var(--gold)">ACHIEVEMENT</b><br><small id="n-desc">Unlocked!</small></div></div>

<header>
    <div style="font-family:'Orbitron'; font-size:0.6rem; color:#444; letter-spacing:3px;">RANK: <span id="rank-name" style="color:var(--gold)">STREET RAT</span></div>
    <h1 id="score">0</h1>
    <div style="font-family:'Orbitron'; font-size:0.75rem; color:var(--neon)">
        LPS: <span id="lps-val">0</span> | POWER: x<span id="click-mult">1.0</span> <span id="rage-bonus" style="color:var(--accent); display:none;">(+3.0 RAGE)</span>
    </div>
</header>

<div class="main-grid">
    <div class="panel">
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('left', 't-casino')">🎰 CASINO</button>
            <button class="tab-btn" onclick="switchTab('left', 't-phones')">📱 GADGETS</button>
        </div>
        <div id="t-casino" class="tab-content active">
            <div class="game-box">
                <b style="font-family:'Orbitron'; color:var(--gold)">🎰 NEON SLOTS</b>
                <div class="slots-row"><div class="slot-item" id="sl1">💎</div><div class="slot-item" id="sl2">💎</div><div class="slot-item" id="sl3">💎</div></div>
                <button class="btn" onclick="spinSlots()">SPIN (2,000)</button>
            </div>
            <div class="game-box">
                <div style="display:flex; justify-content:space-between; font-family:'Orbitron';"><b>💣 MINES</b> <span id="m-mult">x1.0</span></div>
                <div class="mines-grid" id="m-grid"></div>
                <button id="m-start" class="btn" onclick="startMines()">STAKE 5,000</button>
                <button id="m-cash" class="btn" style="display:none; background:var(--gold);" onclick="cashoutMines()">TAKE PROFIT</button>
            </div>
            <div class="game-box">
                <b style="font-family:'Orbitron'; color:var(--accent)">🔴 ROULETTE</b>
                <div id="r-res" style="text-align:center; font-family:'Orbitron'; padding:5px; border:1px solid var(--border); margin:5px 0;">?</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                    <button class="btn" style="background:#ff0055; color:white;" onclick="playR('red')">RED</button>
                    <button class="btn" style="background:#222; color:white;" onclick="playR('black')">BLACK</button>
                </div>
            </div>
        </div>
        <div id="t-phones" class="tab-content"><div id="phone-list"></div></div>
    </div>

    <div id="stage">
        <div id="aura"></div>
        <div id="llama-main" onclick="tap(event)">🦙</div>
    </div>

    <div class="panel">
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('right', 't-biz')">🏢 EMPIRE</button>
            <button class="tab-btn" onclick="switchTab('right', 't-lux')">🏰 LUXURY</button>
            <button class="tab-btn" onclick="switchTab('right', 't-skins')">🎭 SKINS</button>
        </div>
        <div id="t-biz" class="tab-content active"><div id="biz-list"></div></div>
        <div id="t-lux" class="tab-content"><div id="lux-list"></div></div>
        <div id="t-skins" class="tab-content"><div id="skin-list"></div></div>
    </div>
</div>

<script>
    // --- DATABASE ---
    const phoneData = [
        { id: 'p1', n: "Siemens A50", c: 400, p: 1, i: "📟" },
        { id: 'p2', n: "Nokia 3310", c: 2500, p: 8, i: "📱" },
        { id: 'p3', n: "iPhone 2G", c: 15000, p: 50, i: "📲" },
        { id: 'p4', n: "Samsung S24 Ultra", c: 120000, p: 450, i: "🏙️" },
        { id: 'p5', n: "Neural Link Phone", c: 1000000, p: 4000, i: "🧠" },
        { id: 'p6', n: "Quantum Communicator", c: 25000000, p: 100000, i: "📡" },
        { id: 'p7', n: "Black Hole Signal", c: 500000000, p: 2500000, i: "🕳️" }
    ];

    const bizData = [
        { id: 'b1', n: "Lemonade Stand", c: 1000, lps: 20, i: "🥤" },
        { id: 'b2', n: "Cyber Cafe", c: 20000, lps: 350, i: "☕" },
        { id: 'b3', n: "Crypto Farm", c: 300000, lps: 6000, i: "⛏️" },
        { id: 'b4', n: "Stanford Lab", c: 8000000, lps: 120000, i: "🎓" },
        { id: 'b5', n: "Mars Base", c: 200000000, lps: 4000000, i: "🚀" },
        { id: 'b6', n: "Star System Bank", c: 5000000000, lps: 100000000, i: "🏦" }
    ];

    const luxuryData = [
        { id: 'l1', n: "Tesla S", c: 100000, b: 1.1, i: "🏎️" },
        { id: 'l2', n: "Cyber Truck", c: 800000, b: 1.3, i: "🛻" },
        { id: 'l3', n: "G-Wagon Neon", c: 4000000, b: 1.6, i: "🚙" },
        { id: 'l4', n: "Penthouse", c: 20000000, b: 2.2, i: "🏙️" },
        { id: 'l5', n: "Private Island", c: 500000000, b: 6.0, i: "🏝️" },
        { id: 'l6', n: "Cyber Castle", c: 10000000000, b: 15.0, i: "🏰" }
    ];

    const skinData = [
        { id: 's0', n: "Llama", c: 0, i: "🦙" },
        { id: 's1', n: "Cat", c: 50000, i: "🐱" },
        { id: 's2', n: "Robot", c: 1000000, i: "🤖" },
        { id: 's3', n: "Demon", c: 100000000, i: "👹" },
        { id: 's4', n: "Golden Idol", c: 5000000000, i: "🗿" }
    ];

    // --- STATE ---
    let state = {
        score: 0, mult: 1, bizLps: 0, gMult: 1, curSkin: "🦙",
        ups: {}, biz: {}, lux: {}, skins: ['s0'],
        lastClick: 0, rage: 0
    };

    // --- CORE ---
    function save() { localStorage.setItem('llama_v4_save', JSON.stringify(state)); }
    function load() {
        let s = localStorage.getItem('llama_v4_save');
        if(s) { state = JSON.parse(s); recalculate(); updateUI(); }
    }

    function recalculate() {
        state.mult = 1; state.bizLps = 0; state.gMult = 1;
        phoneData.forEach(p => state.mult += (state.ups[p.id] || 0) * p.p);
        bizData.forEach(b => state.bizLps += (state.biz[b.id] || 0) * b.lps);
        luxuryData.forEach(l => { if(state.lux[l.id]) state.gMult *= l.b; });
        document.getElementById('llama-main').innerText = state.curSkin;
    }

    function tap(e) {
        let now = Date.now();
        if(now - state.lastClick < 150) { 
            state.rage = Math.min(state.rage + 0.1, 3); 
        } else { 
            state.rage = Math.max(state.rage - 0.5, 0); 
        }
        state.lastClick = now;

        let totalPwr = (state.mult * state.gMult) + (state.rage > 1 ? (state.mult * state.rage) : 0);
        state.score += totalPwr;

        // Rage FX
        if(state.rage >= 2) {
            document.getElementById('game-body').classList.add('rage-mode');
            document.getElementById('rage-bonus').style.display = 'inline';
        } else {
            document.getElementById('game-body').classList.remove('rage-mode');
            document.getElementById('rage-bonus').style.display = 'none';
        }

        spawnText(e.clientX, e.clientY, `+${Math.floor(totalPwr)}`, state.rage >= 2 ? 'var(--accent)' : 'var(--neon)');
        updateUI();
    }

    function updateUI() {
        document.getElementById('score').innerText = Math.floor(state.score).toLocaleString();
        document.getElementById('lps-val').innerText = Math.floor(state.bizLps * state.gMult).toLocaleString();
        document.getElementById('click-mult').innerText = (state.mult * state.gMult).toFixed(1);
        render();
    }

    function render() {
        const gen = (data, div, type) => {
            document.getElementById(div).innerHTML = data.map(d => {
                let lvl = (type === 'biz' ? state.biz[d.id] : (type === 'up' ? state.ups[d.id] : 0)) || 0;
                let cost = Math.floor(d.c * Math.pow(1.6, lvl));
                let owned = (type === 'lux' && state.lux[d.id]) || (type === 'skin' && state.skins.includes(d.id));
                return `<div class="card ${state.score < cost && !owned ? 'locked' : ''}" onclick="buy('${type}','${d.id}')">
                    <div class="b-icon">${d.i}</div>
                    <div class="b-info"><b>${d.n}</b><small>${owned ? 'OWNED' : 'Cost: ' + cost.toLocaleString()}</small></div>
                    <div class="b-lvl">${lvl > 0 ? 'Lvl '+lvl : ''}</div>
                </div>`;
            }).join('');
        };
        gen(phoneData, 'phone-list', 'up');
        gen(bizData, 'biz-list', 'biz');
        gen(luxuryData, 'lux-list', 'lux');
        gen(skinData, 'skin-list', 'skin');
    }

    function buy(type, id) {
        let d = [...phoneData, ...bizData, ...luxuryData, ...skinData].find(x => x.id === id);
        let lvl = (type === 'biz' ? state.biz[id] : (type === 'up' ? state.ups[id] : 0)) || 0;
        let cost = Math.floor(d.c * Math.pow(1.6, lvl));
        if(state.score >= cost) {
            if(type === 'lux' && !state.lux[id]) { state.lux[id] = true; state.score -= cost; }
            else if(type === 'skin') { if(!state.skins.includes(id)) { state.skins.push(id); state.score -= cost; } state.curSkin = d.i; }
            else if(type === 'biz') { state.biz[id] = lvl + 1; state.score -= cost; }
            else if(type === 'up') { state.ups[id] = lvl + 1; state.score -= cost; }
            recalculate(); save(); updateUI();
        }
    }

    // --- CASINO GAMES ---
    // Slots
    function spinSlots() {
        if(state.score < 2000) return;
        state.score -= 2000;
        const syms = ['🍒', '🍋', '💎', '🦙', '7️⃣'];
        let t = 0;
        let iv = setInterval(() => {
            document.getElementById('sl1').innerText = syms[Math.floor(Math.random()*5)];
            document.getElementById('sl2').innerText = syms[Math.floor(Math.random()*5)];
            document.getElementById('sl3').innerText = syms[Math.floor(Math.random()*5)];
            if(++t > 12) {
                clearInterval(iv);
                let r = [syms[Math.floor(Math.random()*5)], syms[Math.floor(Math.random()*5)], syms[Math.floor(Math.random()*5)]];
                if(Math.random() < 0.1) r = [r[0], r[0], r[0]]; // Lucky spin
                document.getElementById('sl1').innerText = r[0]; document.getElementById('sl2').innerText = r[1]; document.getElementById('sl3').innerText = r[2];
                if(r[0] === r[1] && r[1] === r[2]) { state.score += 50000; showNotif("JACKPOT! +50,000", "🎰"); }
                updateUI();
            }
        }, 60);
    }

    // Mines
    let mActive = false, mMult = 1.0, bIdx = -1;
    function startMines() {
        if(state.score < 5000 || mActive) return;
        state.score -= 5000; mActive = true; mMult = 1.0; bIdx = Math.floor(Math.random()*9);
        document.getElementById('m-start').style.display = 'none';
        document.getElementById('m-cash').style.display = 'block';
        document.getElementById('m-grid').innerHTML = Array.from({length:9}).map((_,i) => `<div class="mine-cell" onclick="hitMine(${i})">?</div>`).join('');
        updateUI();
    }
    function hitMine(i) {
        if(!mActive) return;
        let c = document.getElementById('m-grid').children[i];
        if(i === bIdx) { c.innerText = '💣'; c.style.background = 'var(--accent)'; mActive = false; resetMines(); }
        else { c.innerText = '💎'; c.style.background = 'rgba(0,255,204,0.2)'; mMult += 0.7; document.getElementById('m-mult').innerText = 'x' + mMult.toFixed(1); }
    }
    function cashoutMines() {
        let win = 5000 * mMult; state.score += win; mActive = false; resetMines(); showNotif("WIN: +"+Math.floor(win), "💎"); updateUI();
    }
    function resetMines() { document.getElementById('m-start').style.display = 'block'; document.getElementById('m-cash').style.display = 'none'; }

    // Roulette
    function playR(bet) {
        if(state.score < 5000) return;
        state.score -= 5000;
        let res = Math.floor(Math.random()*37);
        let col = res === 0 ? 'green' : (res % 2 === 0 ? 'black' : 'red');
        document.getElementById('r-res').innerText = res + " (" + col.toUpperCase() + ")";
        if(bet === col) { state.score += 10000; showNotif("WIN!", "🔴"); }
        updateUI();
    }

    // --- UTILS ---
    function switchTab(side, id) {
        const p = document.getElementById(id).parentElement;
        p.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        p.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(id).classList.add('active');
    }
    function spawnText(x, y, txt, col) {
        const d = document.createElement('div'); d.className = 'float-text'; d.style.left = x + 'px'; d.style.top = y + 'px';
        d.style.color = col; d.innerText = txt; document.body.appendChild(d);
        setTimeout(() => d.remove(), 800);
    }
    function showNotif(title, icon) {
        document.getElementById('n-title').innerText = title; document.getElementById('n-icon').innerText = icon;
        const n = document.getElementById('notif'); n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 3000);
    }

    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { save(); window.location.href = 'index.html'; } });
    setInterval(() => { 
        state.score += (state.bizLps * state.gMult / 10); 
        if(state.rage > 0) state.rage = Math.max(state.rage - 0.02, 0);
        updateUI(); 
    }, 100);
    load();
</script>
</body>
</html>
