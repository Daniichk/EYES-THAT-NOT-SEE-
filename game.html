<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LLAMA VANGUARD: IMPERIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffcc; --accent: #ff0055; --gold: #ffd700; --bg: #030305;
            --glass: rgba(10, 10, 20, 0.75); --border: rgba(0, 255, 204, 0.2);
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh;
            display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 100%, #1a0033 0%, var(--bg) 80%);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 10px; }

        /* HEADER */
        header { padding: 20px; text-align: center; z-index: 10; position: relative; }
        #score {
            font-family: 'Orbitron'; font-size: 4.5rem; margin: 0; font-weight: 900;
            background: linear-gradient(180deg, #fff, var(--neon));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0,255,204,0.4));
        }
        .stats-bar { font-family: 'Orbitron'; font-size: 0.8rem; color: var(--gold); letter-spacing: 2px; }

        /* LAYOUT & TABS */
        .main-grid {
            display: grid; grid-template-columns: 380px 1fr 380px; gap: 20px;
            padding: 0 20px 20px; height: calc(100vh - 180px); box-sizing: border-box;
        }
        .panel {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .tab-nav { display: flex; border-bottom: 1px solid var(--border); }
        .tab-btn {
            flex: 1; padding: 15px; background: none; border: none; color: gray;
            font-family: 'Orbitron'; font-weight: 900; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { color: var(--neon); box-shadow: inset 0 -3px 0 var(--neon); background: rgba(0,255,204,0.05); }
        .tab-content { display: none; padding: 20px; overflow-y: auto; flex: 1; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* CENTER AREA */
        #stage { display: flex; justify-content: center; align-items: center; position: relative; flex-direction: column; }
        #aura {
            position: absolute; width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle, var(--neon) 0%, transparent 60%);
            opacity: 0.15; filter: blur(50px); animation: pulse 3s infinite; pointer-events: none;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        #llama-main { font-size: 160px; cursor: pointer; user-select: none; z-index: 10; transition: 0.05s; }
        #llama-main:active { transform: scale(0.9) translateY(10px); filter: drop-shadow(0 0 50px var(--neon)); }

        /* GAMES */
        .game-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .btn {
            background: var(--neon); color: black; border: none; padding: 12px;
            border-radius: 10px; font-weight: 900; font-family: 'Orbitron'; cursor: pointer;
            width: 100%; transition: 0.2s; text-transform: uppercase;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,255,204,0.3); }
        .btn:active { transform: translateY(0); }
        .btn-risk { background: var(--accent); color: white; }

        /* CRASH GAME */
        #crash-chart { height: 100px; border-bottom: 2px solid var(--neon); position: relative; overflow: hidden; margin: 15px 0; background: rgba(0,255,204,0.05); }
        #crash-line {
            position: absolute; bottom: 0; left: 0; width: 0%; height: 2px;
            background: var(--neon); box-shadow: 0 0 10px var(--neon); transition: width 0.1s linear, bottom 0.1s linear;
        }
        #crash-mult { font-family: 'Orbitron'; font-size: 2.5rem; position: absolute; top: 10px; left: 10px; font-weight: 900; }
        .crashed #crash-line { background: var(--accent); box-shadow: 0 0 20px var(--accent); }
        .crashed #crash-mult { color: var(--accent); }

        /* SLOT MACHINE */
        .slots-container { display: flex; justify-content: center; gap: 10px; font-size: 2.5rem; margin: 15px 0; }
        .slot-reel { background: #111; border: 2px solid var(--border); border-radius: 10px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }

        /* BUSINESS & UPGRADES */
        .card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex;
            justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .card:hover { border-color: var(--neon); background: rgba(0,255,204,0.05); }
        .card.locked { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        .b-icon { font-size: 2rem; margin-right: 15px; }
        .b-info { flex: 1; }
        .b-info b { display: block; font-family: 'Orbitron'; font-size: 0.9rem; }
        .b-info small { color: gray; font-size: 0.7rem; }
        .b-stats { text-align: right; font-family: 'Orbitron'; }
        .b-lvl { color: var(--gold); font-size: 0.7rem; }

        /* ACHIEVEMENT MAP */
        .ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .ach-node {
            background: #111; border: 2px solid #333; border-radius: 15px;
            padding: 15px 5px; text-align: center; transition: 0.4s; position: relative;
        }
        .ach-node.unlocked { border-color: var(--gold); background: rgba(255,215,0,0.1); box-shadow: 0 0 15px rgba(255,215,0,0.2); }
        .ach-icon { font-size: 2rem; filter: grayscale(1); transition: 0.4s; }
        .ach-node.unlocked .ach-icon { filter: grayscale(0); transform: scale(1.2); }
        .ach-node p { margin: 5px 0 0; font-size: 0.6rem; font-weight: bold; font-family: 'Orbitron'; color: gray; }
        .ach-node.unlocked p { color: white; }

        /* EFFECTS */
        .shake { animation: hardShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes hardShake { 10%, 90% { transform: translate3d(-2px, 2px, 0); } 20%, 80% { transform: translate3d(4px, -4px, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 6px, 0); } 40%, 60% { transform: translate3d(6px, -6px, 0); } }
        .float-text { position: fixed; font-family: 'Orbitron'; font-weight: 900; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 1000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.5); } }

        /* NOTIFICATION */
        #notif {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 2px solid var(--gold); padding: 15px 30px;
            border-radius: 50px; display: flex; align-items: center; gap: 15px; z-index: 9999;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notif.show { top: 30px; }
    </style>
</head>
<body>

<div id="notif"><span id="n-icon" style="font-size:2rem">🏆</span> <div style="font-family:'Orbitron'"><b id="n-title" style="color:var(--gold)">ACHIEVEMENT</b><br><span id="n-desc">Unlocked!</span></div></div>

<header>
    <div id="rank" style="background:var(--accent); display:inline-block; padding:5px 15px; border-radius:20px; font-family:'Orbitron'; font-size:0.8rem; font-weight:900;">NOBODY</div>
    <h1 id="score">0</h1>
    <div class="stats-bar">
        CLICK MULT: x<span id="click-mult">1.0</span> | PASSIVE: <span id="lps-val">0</span> / SEC
    </div>
</header>

<div class="main-grid">
    <div class="panel">
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('left', 't-casino')">🎰 CASINO</button>
            <button class="tab-btn" onclick="switchTab('left', 't-biz')">🏢 EMPIRE</button>
        </div>
        
        <div id="t-casino" class="tab-content active">
            <div class="game-box" id="crash-box">
                <h3 style="margin:0 0 10px; font-family:'Orbitron'; color:var(--neon);">🚀 NEON CRASH</h3>
                <div id="crash-chart">
                    <div id="crash-mult">1.00x</div>
                    <div id="crash-line"></div>
                </div>
                <button id="btn-crash" class="btn" onclick="startCrash()">BET 1,000</button>
                <button id="btn-cashout" class="btn btn-risk" style="display:none;" onclick="cashOut()">CASH OUT</button>
            </div>

            <div class="game-box">
                <h3 style="margin:0; font-family:'Orbitron'; color:var(--gold);">🎰 CYBER SLOTS</h3>
                <div class="slots-container">
                    <div class="slot-reel" id="s1">🍒</div>
                    <div class="slot-reel" id="s2">🍒</div>
                    <div class="slot-reel" id="s3">🍒</div>
                </div>
                <button class="btn" onclick="spinSlots()">SPIN (500)</button>
            </div>
        </div>

        <div id="t-biz" class="tab-content">
            <div id="biz-list"></div>
        </div>
    </div>

    <div id="stage">
        <div id="aura"></div>
        <div id="llama-main" onclick="tap(event)">🦙</div>
    </div>

    <div class="panel">
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('right', 't-upgrades')">⚡ UPGRADES</button>
            <button class="tab-btn" onclick="switchTab('right', 't-map')">🏆 MAP</button>
        </div>

        <div id="t-upgrades" class="tab-content active">
            <div id="up-list"></div>
        </div>

        <div id="t-map" class="tab-content">
            <div class="ach-grid" id="ach-map"></div>
        </div>
    </div>
</div>

<script>
    let state = {
        score: 0, mult: 1, baseLps: 0, bizLps: 0,
        upgrades: { u1: 0, u2: 0, u3: 0 },
        biz: { b1: 0, b2: 0, b3: 0, b4: 0 },
        achs: []
    };

    const upgData = [
        { id: 'u1', n: "Click Injector", c: 50, p: 0.5, i: "💉" },
        { id: 'u2', n: "Auto Tapper", c: 250, p: 5, i: "⚙️" },
        { id: 'u3', n: "Quantum Core", c: 5000, p: 100, i: "🌌" }
    ];

    const bizData = [
        { id: 'b1', n: "Energy Drink Stand", c: 1000, lps: 15, i: "🥤" },
        { id: 'b2', n: "Darkweb Node", c: 15000, lps: 200, i: "🕸️" },
        { id: 'b3', n: "AI Startup", c: 250000, lps: 3500, i: "🤖" },
        { id: 'b4', n: "Stanford AI Lab", c: 5000000, lps: 80000, i: "🌲" }
    ];

    const achData = [
        { id: 'a1', n: "FIRST BLOOD", req: () => state.score >= 100, i: "🩸" },
        { id: 'a2', n: "HUSTLER", req: () => state.biz.b1 > 0, i: "💼" },
        { id: 'a3', n: "GAMBLER", req: () => crashPlayed >= 5, i: "🎲" },
        { id: 'a4', n: "TECH BRO", req: () => state.biz.b3 > 0, i: "💻" },
        { id: 'a5', n: "MILLIONAIRE", req: () => state.score >= 1000000, i: "💰" },
        { id: 'a6', n: "THE DREAM", req: () => state.biz.b4 > 0, i: "🎓" } // Invisible Stanford inclusion
    ];

    let crashPlayed = 0;

    // CORE
    function tap(e) {
        let gain = 1 * state.mult;
        state.score += gain;
        spawnText(e.clientX, e.clientY, `+${gain.toFixed(1)}`);
        checkAchs();
        updateUI();
    }

    function updateUI() {
        document.getElementById('score').innerText = Math.floor(state.score).toLocaleString();
        document.getElementById('click-mult').innerText = state.mult.toFixed(1);
        let totalLps = state.baseLps + state.bizLps;
        document.getElementById('lps-val').innerText = totalLps.toLocaleString();

        // Rank Update
        let rName = "BROKE"; let rCol = "#888";
        if(state.score > 10000) { rName = "HUSTLER"; rCol = "#00ffcc"; }
        if(state.score > 1000000) { rName = "OVERLORD"; rCol = "#ff0055"; }
        if(state.score > 100000000) { rName = "GOD"; rCol = "#ffd700"; }
        document.getElementById('rank').innerText = rName;
        document.getElementById('rank').style.background = rCol;
        document.getElementById('aura').style.background = `radial-gradient(circle, ${rCol} 0%, transparent 60%)`;

        renderLists();
    }

    // RENDERING
    function renderLists() {
        // Upgrades
        document.getElementById('up-list').innerHTML = upgData.map(u => {
            let cost = Math.floor(u.c * Math.pow(1.5, state.upgrades[u.id]));
            return `
            <div class="card ${state.score < cost ? 'locked' : ''}" onclick="buyUpg('${u.id}')">
                <div class="b-icon">${u.i}</div>
                <div class="b-info"><b>${u.n}</b><small>Cost: ${cost.toLocaleString()}</small></div>
                <div class="b-stats"><div style="color:var(--neon)">+${u.p} Pow</div><div class="b-lvl">Lvl ${state.upgrades[u.id]}</div></div>
            </div>`;
        }).join('');

        // Business
        document.getElementById('biz-list').innerHTML = bizData.map(b => {
            let cost = Math.floor(b.c * Math.pow(1.3, state.biz[b.id]));
            return `
            <div class="card ${state.score < cost ? 'locked' : ''}" onclick="buyBiz('${b.id}')">
                <div class="b-icon">${b.i}</div>
                <div class="b-info"><b>${b.n}</b><small>Cost: ${cost.toLocaleString()}</small></div>
                <div class="b-stats"><div style="color:var(--gold)">+${b.lps}/s</div><div class="b-lvl">Lvl ${state.biz[b.id]}</div></div>
            </div>`;
        }).join('');

        // Ach Map
        document.getElementById('ach-map').innerHTML = achData.map(a => {
            let unl = state.achs.includes(a.id);
            return `<div class="ach-node ${unl ? 'unlocked' : ''}"><div class="ach-icon">${a.i}</div><p>${a.n}</p></div>`;
        }).join('');
    }

    function buyUpg(id) {
        let u = upgData.find(x => x.id === id);
        let cost = Math.floor(u.c * Math.pow(1.5, state.upgrades[id]));
        if(state.score >= cost) {
            state.score -= cost; state.upgrades[id]++; state.mult += u.p; updateUI();
        }
    }

    function buyBiz(id) {
        let b = bizData.find(x => x.id === id);
        let cost = Math.floor(b.c * Math.pow(1.3, state.biz[id]));
        if(state.score >= cost) {
            state.score -= cost; state.biz[id]++; state.bizLps += b.lps; checkAchs(); updateUI();
        }
    }

    function checkAchs() {
        achData.forEach(a => {
            if(!state.achs.includes(a.id) && a.req()) {
                state.achs.push(a.id);
                state.mult += 1.0; // Global bonus
                showNotif(a.n, a.i);
            }
        });
    }

    // TABS
    function switchTab(side, targetId) {
        const panel = document.getElementById(targetId).parentElement;
        panel.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        panel.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(targetId).classList.add('active');
    }

    // CRASH GAME
    let crashInt, cMult = 1.0, isCrashing = false;
    function startCrash() {
        if(state.score < 1000 || isCrashing) return;
        state.score -= 1000; crashPlayed++; isCrashing = true; checkAchs(); updateUI();
        
        document.getElementById('btn-crash').style.display = 'none';
        document.getElementById('btn-cashout').style.display = 'block';
        document.getElementById('crash-box').classList.remove('crashed');
        
        cMult = 1.0;
        let crashPoint = 1.0 + Math.pow(Math.random() * 10, 2) / 10; // RNG bias to lower numbers

        crashInt = setInterval(() => {
            cMult += 0.02 * cMult;
            let percent = Math.min((cMult / 10) * 100, 100);
            document.getElementById('crash-mult').innerText = cMult.toFixed(2) + "x";
            document.getElementById('crash-line').style.width = percent + "%";
            document.getElementById('crash-line').style.bottom = (percent/2) + "px";

            if(cMult >= crashPoint) {
                clearInterval(crashInt);
                document.getElementById('crash-box').classList.add('crashed');
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 400);
                resetCrash();
            }
        }, 50);
    }

    function cashOut() {
        if(!isCrashing) return;
        clearInterval(crashInt);
        let win = 1000 * cMult;
        state.score += win;
        spawnText(window.innerWidth/2, window.innerHeight/2, `+${Math.floor(win)}!`);
        resetCrash();
        updateUI();
    }

    function resetCrash() {
        isCrashing = false;
        document.getElementById('btn-crash').style.display = 'block';
        document.getElementById('btn-cashout').style.display = 'none';
    }

    // SLOTS
    function spinSlots() {
        if(state.score < 500) return;
        state.score -= 500; updateUI();
        const sym = ['🍒', '🍋', '🔔', '💎', '🦙'];
        let t = 0;
        let int = setInterval(() => {
            document.getElementById('s1').innerText = sym[Math.floor(Math.random()*sym.length)];
            document.getElementById('s2').innerText = sym[Math.floor(Math.random()*sym.length)];
            document.getElementById('s3').innerText = sym[Math.floor(Math.random()*sym.length)];
            t++;
            if(t > 15) {
                clearInterval(int);
                let r1 = sym[Math.floor(Math.random()*sym.length)];
                let r2 = sym[Math.floor(Math.random()*sym.length)];
                let r3 = sym[Math.floor(Math.random()*sym.length)];
                // Cheat code for visual fun: 10% chance to force win
                if(Math.random() < 0.1) r2 = r3 = r1; 
                
                document.getElementById('s1').innerText = r1;
                document.getElementById('s2').innerText = r2;
                document.getElementById('s3').innerText = r3;

                if(r1===r2 && r2===r3) {
                    let w = r1 === '🦙' ? 50000 : 5000;
                    state.score += w;
                    spawnText(window.innerWidth/2, window.innerHeight/2, `JACKPOT! +${w}`);
                    document.body.classList.add('shake');
                    setTimeout(() => document.body.classList.remove('shake'), 400);
                }
                updateUI();
            }
        }, 50);
    }

    // UTILS
    function spawnText(x, y, txt) {
        const div = document.createElement('div');
        div.className = 'float-text'; div.style.left = x + 'px'; div.style.top = y + 'px';
        div.style.color = 'var(--neon)'; div.innerText = txt;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 800);
    }

    function showNotif(title, icon) {
        document.getElementById('n-title').innerText = title;
        document.getElementById('n-icon').innerText = icon;
        const n = document.getElementById('notif');
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 3000);
    }

    // LOOP
    setInterval(() => {
        state.score += (state.baseLps + state.bizLps) / 10;
        updateUI();
    }, 100);

    updateUI();
</script>
</body>
</html>
