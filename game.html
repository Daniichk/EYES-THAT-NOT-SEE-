<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LLAMA VANGUARD: CASINO EMPIRE</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --neon: #00ff87;
            --accent: #ff007a;
            --gold: #f1c40f;
            --bg: #08080c;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Inter', sans-serif; overflow: hidden;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 20% 30%, #1a1a2e 0%, #08080c 100%);
        }

        /* HUD & RANKS */
        #hud { position: absolute; top: 30px; text-align: center; z-index: 100; width: 100%; pointer-events: none; }
        #rank-badge { 
            background: linear-gradient(90deg, var(--accent), #7000ff);
            color: white; padding: 5px 20px; border-radius: 50px;
            font-size: 0.8rem; font-weight: 900; font-family: 'Orbitron';
            box-shadow: 0 0 20px rgba(255, 0, 122, 0.4);
            display: inline-block; margin-bottom: 10px;
        }
        #score {
            font-family: 'Orbitron', sans-serif; font-size: 4rem; margin: 0;
            background: linear-gradient(to bottom, #fff, var(--neon));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--neon));
        }

        /* LAYOUT */
        .grid { display: grid; grid-template-columns: 300px 1fr 300px; width: 98%; height: 85vh; gap: 20px; align-items: start; }

        .panel {
            background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 30px;
            height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }

        /* GAMES SECTION */
        .game-box {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            border-radius: 20px; padding: 15px; margin-bottom: 15px; text-align: center;
        }
        .btn {
            background: var(--neon); color: black; border: none; padding: 10px;
            border-radius: 10px; font-weight: 800; cursor: pointer; font-family: 'Orbitron';
            width: 100%; margin-top: 10px; transition: 0.2s;
        }
        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }
        .btn-risk { background: var(--accent); color: white; }

        /* TOWER GAME */
        .tower-grid { display: grid; grid-template-rows: repeat(5, 1fr); gap: 5px; margin: 10px 0; }
        .tower-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; opacity: 0.5; }
        .tower-row.active { opacity: 1; border: 1px solid var(--neon); border-radius: 5px; }
        .tower-cell { background: var(--glass); padding: 5px; border-radius: 4px; font-size: 0.7rem; }

        /* CENTER STAGE */
        #stage { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #llama-main { font-size: 160px; cursor: pointer; transition: 0.05s; user-select: none; z-index: 5; }
        #llama-main:active { transform: scale(0.8); }

        /* SHOP ITEMS */
        .shop-item {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; border: 1px solid transparent;
        }
        .shop-item:hover { border-color: var(--neon); background: rgba(0, 255, 135, 0.05); }

        /* UTILS */
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

<div id="hud">
    <div id="rank-badge">RANK: BROKE STUDENT</div>
    <h1 id="score">0</h1>
    <div style="color:var(--neon); font-size:0.8rem; font-weight:900;">LPS: <span id="lps-val">0</span></div>
</div>

<div class="grid">
    <!-- ЛЕВАЯ ПАНЕЛЬ: КАЗИНО -->
    <div class="panel">
        <h2 style="font-family:'Orbitron'; color:var(--accent); font-size:1.2rem; margin-bottom:20px;">🎰 GAMBLE CORE</h2>
        
        <!-- TOWER -->
        <div class="game-box">
            <span style="font-size:0.7rem; font-weight:900;">🗼 LLAMA TOWER (x100 Potential)</span>
            <div id="tower" class="tower-grid">
                <div class="tower-row" id="tr-4"><div class="tower-cell">x12</div><div class="tower-cell">x12</div><div class="tower-cell">x12</div></div>
                <div class="tower-row" id="tr-3"><div class="tower-cell">x5</div><div class="tower-cell">x5</div><div class="tower-cell">x5</div></div>
                <div class="tower-row" id="tr-2"><div class="tower-cell">x3</div><div class="tower-cell">x3</div><div class="tower-cell">x3</div></div>
                <div class="tower-row" id="tr-1"><div class="tower-cell">x2</div><div class="tower-cell">x2</div><div class="tower-cell">x2</div></div>
                <div class="tower-row" id="tr-0"><div class="tower-cell">x1.5</div><div class="tower-cell">x1.5</div><div class="tower-cell">x1.5</div></div>
            </div>
            <button class="btn btn-risk" onclick="playTower()">STAKE 500 🦙</button>
        </div>

        <!-- ROULETTE -->
        <div class="game-box">
            <span style="font-size:0.7rem; font-weight:900;">🔴 ROULETTE (RED/BLACK)</span>
            <div id="roulette-res" style="font-size:1.5rem; margin:10px;">❓</div>
            <div style="display:flex; gap:5px;">
                <button class="btn" style="background:#ff4d4d; color:white;" onclick="gambleRoulette('red')">RED</button>
                <button class="btn" style="background:#222; color:white;" onclick="gambleRoulette('black')">BLACK</button>
            </div>
        </div>

        <!-- BLACKJACK LIGHT -->
        <div class="game-box">
            <span style="font-size:0.7rem; font-weight:900;">🃏 LLAMA JACK (21)</span>
            <div id="bj-status" style="font-size:0.8rem; margin:5px; color:var(--neon);">Dealer stands on 17</div>
            <button class="btn" onclick="playBlackjack()">PLAY FOR 1000 🦙</button>
        </div>
    </div>

    <!-- ЦЕНТР: ЛАМА -->
    <div id="stage">
        <div id="llama-main" onclick="tap(event)">🦙</div>
        <button class="btn btn-risk" style="width:200px; margin-top:30px;" onclick="allIn()">ALL IN (DOUBLE/NOTHING)</button>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ: МАГАЗИН И РАНГИ -->
    <div class="panel">
        <h2 style="font-family:'Orbitron'; color:var(--neon); font-size:1.2rem; margin-bottom:20px;">⚡ UPGRADES</h2>
        <div id="shop-list"></div>
        <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
        <h2 style="font-family:'Orbitron'; color:var(--gold); font-size:1rem;">📊 NEXT RANK</h2>
        <div id="rank-progress" style="font-size:0.7rem; background:rgba(255,255,255,0.1); border-radius:10px; padding:10px;">
            Target: <span id="next-rank-val">1,000</span>
        </div>
    </div>
</div>

<script>
    let state = {
        score: 0,
        lps: 0,
        rankIndex: 0,
        totalClicks: 0
    };

    const ranks = [
        { n: "DEBTOR STUDENT", req: 0 },
        { n: "STREET HUSTLER", req: 1000 },
        { n: "CRYPTO BRO", req: 10000 },
        { n: "CASINO OWNER", req: 50000 },
        { n: "LLAMA WHALE", req: 250000 },
        { n: "MARK ZUCKERLLAMA", req: 1000000 },
        { n: "INTERGALACTIC GOD", req: 10000000 }
    ];

    const upgrades = [
        { n: "Auto-Clicker", c: 20, p: 1, i: "🖱️" },
        { n: "Gaming PC", c: 150, p: 10, i: "💻" },
        { n: "Mining Rig", c: 1000, p: 50, i: "⛓️" },
        { n: "Llama AI", c: 5000, p: 200, i: "🧠" }
    ];

    // --- CORE ---
    function tap(e) {
        state.score += 1;
        state.totalClicks++;
        spawnText(e.clientX, e.clientY, "+1");
        update();
    }

    function update() {
        document.getElementById('score').innerText = Math.floor(state.score).toLocaleString();
        document.getElementById('lps-val').innerText = state.lps.toFixed(1);
        
        // Ranks
        let currentRank = ranks[0];
        for(let r of ranks) {
            if(state.score >= r.req) currentRank = r;
        }
        document.getElementById('rank-badge').innerText = `RANK: ${currentRank.n}`;
        
        const next = ranks[ranks.indexOf(currentRank) + 1] || {n: "MAX", req: "∞"};
        document.getElementById('next-rank-val').innerText = next.req.toLocaleString() + ` (${next.n})`;

        // Shop
        document.getElementById('shop-list').innerHTML = upgrades.map((u, i) => `
            <div class="shop-item" onclick="buy(${i})">
                <div><b>${u.i} ${u.n}</b><br><small>Cost: ${u.c}</small></div>
                <div style="color:var(--neon)">+${u.p}</div>
            </div>
        `).join('');
    }

    function buy(i) {
        if(state.score >= upgrades[i].c) {
            state.score -= upgrades[i].c;
            state.lps += upgrades[i].p;
            upgrades[i].c = Math.floor(upgrades[i].c * 1.4);
            update();
        }
    }

    // --- CASINO GAMES ---
    
    // 1. Roulette
    function gambleRoulette(choice) {
        if(state.score < 100) return alert("Min bet 100!");
        state.score -= 100;
        const res = Math.random() > 0.5 ? 'red' : 'black';
        document.getElementById('roulette-res').innerText = res === 'red' ? '🔴' : '⚫';
        if(choice === res) {
            state.score += 250;
            alert("WIN! +250");
        }
        update();
    }

    // 2. Tower (simplified)
    function playTower() {
        if(state.score < 500) return alert("Min bet 500!");
        state.score -= 500;
        let level = 0;
        const interval = setInterval(() => {
            if(level > 4) { clearInterval(interval); state.score += 10000; alert("TOWER CONQUERED! +10k"); update(); return; }
            if(Math.random() > 0.4) {
                document.getElementById(`tr-${level}`).style.background = "rgba(0,255,135,0.2)";
                level++;
            } else {
                clearInterval(interval);
                alert("TOWER COLLAPSED! You lost.");
                resetTower();
            }
        }, 500);
    }
    function resetTower() {
        for(let i=0; i<5; i++) document.getElementById(`tr-${i}`).style.background = "none";
    }

    // 3. Blackjack (Simplified: 1-on-1 draw)
    function playBlackjack() {
        if(state.score < 1000) return alert("Min bet 1000!");
        state.score -= 1000;
        const player = Math.floor(Math.random() * 10) + 15; // 15-25
        const dealer = Math.floor(Math.random() * 10) + 15; // 15-25
        
        if(player <= 21 && (player > dealer || dealer > 21)) {
            state.score += 3000;
            alert(`You: ${player}, Dealer: ${dealer}. YOU WIN 3x!`);
        } else {
            alert(`You: ${player}, Dealer: ${dealer}. BUST / DEALER WINS.`);
        }
        update();
    }

    function allIn() {
        if(state.score <= 0) return;
        if(confirm("ALL IN? 50/50 chance to double or lose everything!")) {
            if(Math.random() > 0.5) {
                state.score *= 2;
                alert("LEGEND! Doubled.");
            } else {
                state.score = 0;
                alert("Back to being a broke student.");
            }
            update();
        }
    }

    // --- EFFECTS ---
    function spawnText(x, y, txt) {
        const div = document.createElement('div');
        div.innerText = txt;
        div.style.cssText = `position:fixed; left:${x}px; top:${y}px; color:var(--neon); font-weight:900; pointer-events:none; transition:0.8s;`;
        document.body.appendChild(div);
        setTimeout(() => { div.style.transform = "translateY(-100px)"; div.style.opacity = "0"; }, 10);
        setTimeout(() => div.remove(), 800);
    }

    // --- LOOP ---
    setInterval(() => {
        state.score += state.lps / 10;
        update();
    }, 100);

    update();
</script>
</body>
</html>
