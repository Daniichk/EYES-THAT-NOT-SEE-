<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>LLAMA VANGUARD | EVOLUTION</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --neon: #00ff87;
            --neon-glow: rgba(0, 255, 135, 0.4);
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.05);
            --llama-font: 200px;
        }

        /* ТЕМЫ ИНТЕРФЕЙСА */
        body.theme-pink { --neon: #ff00cc; --neon-glow: rgba(255, 0, 204, 0.4); }
        body.theme-gold { --neon: #f1c40f; --neon-glow: rgba(241, 196, 15, 0.4); }
        body.theme-ice { --neon: #00d4ff; --neon-glow: rgba(0, 212, 255, 0.4); }

        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.5s ease;
        }

        #bg-effect {
            position: fixed;
            top: 0; left: 0; z-index: -1; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0,255,135,0.05) 0%, #030303 100%);
        }

        /* --- ВЕРХНЯЯ ЧАСТЬ --- */
        #header { text-align: center; z-index: 100; margin-bottom: 20px; }
        #score-container {
            font-family: 'Montserrat', sans-serif;
            font-size: 5rem;
            margin: 0;
            background: linear-gradient(to bottom, #fff, var(--neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--neon-glow));
        }

        /* --- ЛАМА --- */
        #llama-container {
            position: relative;
            width: 300px; height: 300px;
            cursor: pointer;
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.05s;
        }
        #llama-container:active { transform: scale(0.85); }
        #llama-display { font-size: var(--llama-font); filter: drop-shadow(0 0 20px var(--neon-glow)); }

        /* --- ПАНЕЛИ --- */
        .side-panel {
            position: absolute;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 32px;
            width: 300px;
            max-height: 85vh;
            overflow-y: auto;
        }
        #shop { right: 20px; }
        #achievements { left: 20px; }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 12px;
            transition: 0.3s;
        }
        .card.locked { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
        .card.unlocked { border-color: var(--neon); cursor: pointer; }
        .card.unlocked:hover { background: rgba(0,255,135,0.1); transform: scale(1.02); }

        .label { font-size: 0.6rem; letter-spacing: 2px; color: var(--neon); font-weight: 800; text-transform: uppercase; }
        .title { display: block; font-weight: 700; margin-top: 5px; }

        /* --- ЧАСТИЦЫ --- */
        .click-text {
            position: absolute;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            pointer-events: none;
            animation: float 0.8s ease-out forwards;
            z-index: 1000;
        }
        @keyframes float { 0% { transform: translate(0,0); opacity: 1; } 100% { transform: translate(0,-150px); opacity: 0; } }

    </style>
</head>
<body>

<div id="bg-effect"></div>

<div id="header">
    <div class="label">Total Influence</div>
    <h1 id="score-container">0</h1>
    <div class="label" id="stats">LPS: 0.0 • LEVEL: 1</div>
</div>

<div id="achievements" class="side-panel">
    <h3 style="margin-top:0; letter-spacing:1px;">🏆 MILESTONES</h3>
    <div id="ach-list">
        <!-- Достижения генерируются скриптом -->
    </div>
</div>

<div id="llama-container" onclick="handleClick(event)">
    <div id="llama-display">🦙</div>
</div>

<div id="shop" class="side-panel">
    <h3 style="margin-top:0; letter-spacing:1px;">⚡ UPGRADES</h3>
    <div id="shop-list"></div>
</div>

<script>
    let score = 0, lps = 0, totalClicks = 0, level = 1;
    let currentTheme = 'default';

    const upgrades = [
        { id: 'u1', n: 'Viral Post', c: 15, p: 0.5, e: '📱' },
        { id: 'u2', n: 'Health Coach', c: 150, p: 3, e: '🥗' },
        { id: 'u3', n: 'Fitness App', c: 1200, p: 15, e: '⌚' },
        { id: 'u4', n: 'Wellness Gym', c: 8000, p: 60, e: '🏋️' }
    ];

    const milestones = [
        { id: 'm1', n: 'Cyber Llama', req: 50, type: 'skin', val: '🤖', desc: '50 clicks' },
        { id: 'm2', n: 'Neon Pink', req: 1000, type: 'theme', val: 'theme-pink', desc: '1,000 points' },
        { id: 'm3', n: 'Cosmic Llama', req: 500, reqClicks: 200, type: 'skin', val: '👽', desc: '200 clicks' },
        { id: 'm4', n: 'Ice Cold', req: 10000, type: 'theme', val: 'theme-ice', desc: '10,000 points' },
        { id: 'm5', n: 'Golden Era', req: 100000, type: 'theme', val: 'theme-gold', desc: '100,000 points' },
        { id: 'm6', n: 'God Mode', req: 1000000, type: 'skin', val: '👑', desc: '1M points' }
    ];

    let unlockedAch = [];

    function handleClick(e) {
        let gain = 1 * level;
        score += gain;
        totalClicks++;
        checkMilestones();
        spawnText(e.clientX, e.clientY, `+${gain}`);
        updateUI();
    }

    function spawnText(x, y, txt) {
        const div = document.createElement('div');
        div.className = 'click-text';
        div.innerText = txt;
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.color = 'var(--neon)';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 800);
    }

    function checkMilestones() {
        milestones.forEach(m => {
            if (!unlockedAch.includes(m.id)) {
                const metPoints = score >= (m.req || 0);
                const metClicks = totalClicks >= (m.reqClicks || 0);
                if (metPoints && metClicks) {
                    unlockedAch.push(m.id);
                    renderAchievements();
                }
            }
        });
    }

    function applyReward(id) {
        const m = milestones.find(x => x.id === id);
        if (!unlockedAch.includes(id)) return;

        if (m.type === 'skin') {
            document.getElementById('llama-display').innerText = m.val;
        } else if (m.type === 'theme') {
            document.body.className = m.val;
        }
    }

    function buyUpgrade(idx) {
        const u = upgrades[idx];
        if (score >= u.c) {
            score -= u.c;
            lps += u.p;
            u.c *= 1.5;
            level = 1 + Math.floor(lps / 10);
            renderShop();
            updateUI();
        }
    }

    function renderShop() {
        const html = upgrades.map((u, i) => `
            <div class="card unlocked" onclick="buyUpgrade(${i})">
                <span class="label">${u.e} ${Math.floor(u.c)} POINTS</span>
                <span class="title">${u.n} <small>(+${u.p} lps)</small></span>
            </div>
        `).join('');
        document.getElementById('shop-list').innerHTML = html;
    }

    function renderAchievements() {
        const html = milestones.map(m => {
            const isUnlocked = unlockedAch.includes(m.id);
            return `
                <div class="card ${isUnlocked ? 'unlocked' : 'locked'}" onclick="applyReward('${m.id}')">
                    <span class="label">${isUnlocked ? 'UNLOCKED' : 'LOCKED'}</span>
                    <span class="title">${m.n}</span>
                    <small style="color:var(--text-dim)">${m.desc}</small>
                </div>
            `;
        }).join('');
        document.getElementById('ach-list').innerHTML = html;
    }

    function updateUI() {
        document.getElementById('score-container').innerText = Math.floor(score).toLocaleString();
        document.getElementById('stats').innerText = `LPS: ${lps.toFixed(1)} • LEVEL: ${level}`;
    }

    // Escape to Menu
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape') window.location.href = 'index.html';
        if (e.ctrlKey && e.shiftKey && (e.key === '6')) { score = 9999999; updateUI(); checkMilestones(); }
    });

    setInterval(() => { score += lps/10; updateUI(); checkMilestones(); }, 100);
    
    renderShop();
    renderAchievements();
    updateUI();
</script>

</body>
</html>
