<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Zen | Analytics Enabled</title>
    <style>
        :root { --bg: #050505; --accent: #64ffda; --secondary: #7f5af0; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Courier New', monospace; scroll-behavior: smooth; overflow-x: hidden; }
        
        section {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-bottom: 1px solid #111;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .label {
            z-index: 10;
            text-align: center;
            background: rgba(5, 5, 5, 0.7);
            padding: 25px;
            border-radius: 2px;
            border: 1px solid rgba(100, 255, 218, 0.1);
            backdrop-filter: blur(5px);
        }

        h2 { font-weight: 100; letter-spacing: 12px; color: var(--accent); margin: 0; text-transform: uppercase; }
        p { opacity: 0.4; font-size: 0.75rem; margin-top: 15px; letter-spacing: 2px; }

        .scroll-down {
            position: absolute;
            bottom: 30px;
            font-size: 0.6rem;
            letter-spacing: 5px;
            opacity: 0.3;
            animation: breathe 3s infinite;
        }

        @keyframes breathe { 0%, 100% { opacity: 0.1; transform: translateY(0); } 50% { opacity: 0.6; transform: translateY(-5px); } }
    </style>
</head>
<body>

    <!-- SECTION 1: CALCULUS (Vector Field) -->
    <section id="s1">
        <canvas id="canvas1"></canvas>
        <div class="label">
            <h2>Calculus</h2>
            <p>The derivative of the flow.</p>
        </div>
        <div class="scroll-down">DESCEND INTO MATH</div>
    </section>

    <!-- SECTION 2: TRIGONOMETRY (Wave Interference) -->
    <section id="s2">
        <canvas id="canvas2"></canvas>
        <div class="label">
            <h2>Trigonometry</h2>
            <p>Oscillations in the dark.</p>
        </div>
    </section>

    <!-- SECTION 3: PROBABILITY (Gaussian Cloud) -->
    <section id="s3">
        <canvas id="canvas3"></canvas>
        <div class="label">
            <h2>Probability</h2>
            <p>Order within the chaos.</p>
        </div>
    </section>

    <!-- VERCEL ANALYTICS SCRIPT -->
    <script defer src="/_vercel/insights/script.js"></script>

    <script>
        const mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // --- SECTION 1: VECTOR FIELD ---
        const c1 = document.getElementById('canvas1');
        const ctx1 = c1.getContext('2d');
        function draw1() {
            c1.width = window.innerWidth; c1.height = window.innerHeight;
            ctx1.strokeStyle = 'rgba(100, 255, 218, 0.2)';
            for(let x=0; x<c1.width; x+=50) {
                for(let y=0; y<c1.height; y+=50) {
                    let dx = mouse.x - x;
                    let dy = mouse.y - y;
                    let angle = Math.atan2(dy, dx);
                    ctx1.beginPath();
                    ctx1.moveTo(x, y);
                    ctx1.lineTo(x + Math.cos(angle)*15, y + Math.sin(angle)*15);
                    ctx1.stroke();
                }
            }
            requestAnimationFrame(draw1);
        }

        // --- SECTION 2: TRIG WAVES ---
        const c2 = document.getElementById('canvas2');
        const ctx2 = c2.getContext('2d');
        function draw2() {
            c2.width = window.innerWidth; c2.height = window.innerHeight;
            ctx2.strokeStyle = '#7f5af0';
            ctx2.lineWidth = 1;
            let time = Date.now() * 0.001;
            for(let i=0; i<10; i++) {
                ctx2.beginPath();
                for(let x=0; x<c2.width; x+=10) {
                    let y = c2.height/2 + Math.sin(x*0.005 + time + i*0.5) * (mouse.y*0.1);
                    ctx2.lineTo(x, y);
                }
                ctx2.stroke();
            }
            requestAnimationFrame(draw2);
        }

        // --- SECTION 3: PROBABILITY ---
        const c3 = document.getElementById('canvas3');
        const ctx3 = c3.getContext('2d');
        function draw3() {
            c3.width = window.innerWidth; c3.height = window.innerHeight;
            ctx3.fillStyle = 'rgba(100, 255, 218, 0.4)';
            for(let i=0; i<200; i++) {
                let r = Math.sqrt(-2 * Math.log(Math.random())) * 80;
                let theta = 2 * Math.PI * Math.random();
                let x = mouse.x + r * Math.cos(theta);
                let y = (mouse.y - (window.innerHeight * 2)) + r * Math.sin(theta);
                ctx3.fillRect(x, y, 1, 1);
            }
            requestAnimationFrame(draw3);
        }

        draw1(); draw2(); draw3();
    </script>
</body>
</html>
