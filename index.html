<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multidimensional Probability Theory</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        :root { --neon: #00f2ff; --gold: #ffd700; --bg: #050a14; --card: #111827; --danger: #f43f5e; --success: #10b981; }
        body { font-family: 'Inter', sans-serif; background: #fff; margin: 0; overflow: hidden; transition: background 0.8s ease; }
        .hidden { display: none !important; }
        
        /* Math Mask */
        #math-ui { padding: 40px; color: #333; max-width: 800px; margin: auto; }
        .formula { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #3b82f6; font-family: monospace; }

        /* Game Interface */
        #game-ui { position: fixed; inset: 0; background: var(--bg); color: white; display: grid; grid-template-columns: 1fr 380px; }
        .click-area { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
        #big-brain { font-size: 150px; z-index: 10; cursor: pointer; filter: drop-shadow(0 0 30px var(--neon)); transition: 0.1s; user-select: none; }
        #big-brain:active { transform: scale(0.9); }

        /* Sidebar Tabs */
        .sidebar { background: var(--card); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .tab-btn { background: #1e293b; color: white; border: 1px solid #334155; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .tab-btn.active { border-color: var(--neon); background: #334155; }

        .stat-card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .stat-val { font-size: 32px; color: var(--neon); font-weight: bold; }

        .shop-item { background: #1f2937; padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; }
        .shop-item:hover:not(.disabled) { border-color: var(--neon); }
        .shop-item.disabled { opacity: 0.3; cursor: not-allowed; }

        /* Modals */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .modal { background: #161b33; border: 2px solid var(--neon); padding: 30px; border-radius: 24px; width: 450px; text-align: center; }
        .casino-btn { background: #3b82f6; color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.2s; }

        /* Dimension Visuals */
        .dim-cyber { background: radial-gradient(circle, #0f172a 0%, #020617 100%); }
        .dim-candy { background: radial-gradient(circle, #f472b6 0%, #be185d 100%); }
        .dim-void { background: radial-gradient(circle, #262626 0%, #000000 100%); }

        /* Orbits */
        .orbit-item { position: absolute; animation: rotate var(--speed) linear infinite; transform-origin: var(--dist) 0; left: 50%; top: 50%; pointer-events: none; font-size: 24px; }
        @keyframes rotate { from { transform: rotate(0deg) translate(var(--dist)) rotate(0deg); } to { transform: rotate(360deg) translate(var(--dist)) rotate(-360deg); } }
    </style>
</head>
<body>

<div id="math-ui">
    <h1>Advanced Matrix Theory</h1>
    <div class="formula">det(A) = Σ (-1)^(1+j) a_1j det(A_1j)</div>
    <p>In linear algebra, the determinant is a scalar value that can be computed from the elements of a square matrix...</p>
    <p style="color: #888; font-size: 13px;">Press <b>ESC</b> to initiate the neural bridge.</p>
</div>

<div id="game-ui" class="hidden">
    <div class="click-area" id="main-bg">
        <div id="big-brain">🫠</div>
        <div style="z-index: 10; text-align: center; margin-top: 20px;">
            <h2 id="dim-name" style="margin: 0; color: var(--neon); letter-spacing: 2px;">NEURAL CORE</h2>
            <small>Diplomas: <span id="pres-val">0</span></small>
        </div>
    </div>

    <div class="sidebar">
        <div class="stat-card">
            <div class="stat-val" id="score">0</div>
            <div style="font-size: 14px; color: var(--neon);">+<span id="bps">0</span>/s</div>
        </div>

        <div style="display: flex; gap: 5px; margin: 10px 0;">
            <button class="tab-btn active" onclick="switchTab('items')">ITEMS</button>
            <button class="tab-btn" onclick="switchTab('design')">SKINS</button>
            <button class="tab-btn" onclick="switchTab('dims')">WORLDS</button>
            <button class="tab-btn" style="color:var(--danger)" onclick="toggleCasino(true)">🎰</button>
        </div>

        <div id="tab-items">
            <div id="shop-container"></div>
        </div>

        <div id="tab-design" class="hidden">
            <h4 style="font-size: 12px; color: #888;">UNLOCKED SKINS</h4>
            <div id="skin-container"></div>
        </div>

        <div id="tab-dims" class="hidden">
            <h4 style="font-size: 12px; color: #888;">DIMENSIONS</h4>
            <div id="dim-container"></div>
        </div>
    </div>
</div>

<div id="casino-overlay" class="hidden overlay">
    <div class="modal">
        <h2 style="color: var(--gold);">NEURAL CASINO</h2>
        <input type="number" id="bet-val" style="background:#000; color:white; border:1px solid var(--neon); padding:10px; width:80%; margin: 10px 0;" placeholder="Bet Amount...">
        <button class="casino-btn" onclick="playCoinflip()">Coinflip (x2)</button>
        <button class="casino-btn" onclick="toggleCasino(false)">Close</button>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('neu_multiverse_v1')) || {
        cells: 0, power: 1, auto: 0, mult: 1, prestige: 0,
        currentSkin: '🫠', currentDim: 'cyber',
        items: { cursor: 0, eraser: 0, ruler: 0, prot: 0, compass: 0, ai: 0, link: 0 },
        ownedSkins: ['🫠'], ownedDims: ['cyber']
    };

    const config = {
        items: {
            cursor: { name: 'Auto-Cursor', icon: '🖱️', base: 15, p: 0.2, d: 110 },
            eraser: { name: 'Eraser', icon: '🧽', base: 100, p: 1.5, d: 150 },
            ruler: { name: 'Ruler', icon: '📏', base: 600, p: 8, d: 190 },
            prot: { name: 'Protractor', icon: '📐', base: 3000, p: 30, d: 230 },
            compass: { name: 'Void Compass', icon: '🧭', base: 15000, p: 120, d: 270 },
            ai: { name: 'AI Tutor', icon: '🤖', base: 75000, p: 600, d: 310 },
            link: { name: 'Neural Link', icon: '🧬', base: 400000, p: 3000, d: 350 }
        },
        skins: [
            { id: '🫠', cost: 0 }, { id: '🤡', cost: 5000 }, { id: '👽', cost: 25000 }, 
            { id: '🤖', cost: 100000 }, { id: '👑', cost: 1000000 }
        ],
        dims: [
            { id: 'cyber', name: 'Cyber World', cost: 0, class: 'dim-cyber' },
            { id: 'candy', name: 'Candy Hell', cost: 50000, class: 'dim-candy' },
            { id: 'void', name: 'The Void', cost: 500000, class: 'dim-void' }
        ]
    };

    window.onkeydown = (e) => {
        if (e.key === 'Escape') {
            document.getElementById('game-ui').classList.toggle('hidden');
            document.body.style.background = document.getElementById('game-ui').classList.contains('hidden') ? '#fff' : 'black';
        }
        if (e.code === 'Space' && !e.repeat && !document.getElementById('game-ui').classList.contains('hidden')) doClick();
    };

    function doClick() {
        let b = 1 + (state.prestige * 0.25);
        state.cells += (state.power * state.mult * b);
        update();
    }

    function switchTab(t) {
        ['items', 'design', 'dims'].forEach(id => {
            document.getElementById('tab-'+id).classList.add('hidden');
        });
        document.getElementById('tab-'+t).classList.remove('hidden');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    function buyItem(id) {
        let p = Math.floor(config.items[id].base * Math.pow(1.15, state.items[id]));
        if (state.cells >= p) {
            state.cells -= p; state.items[id]++; state.auto += config.items[id].p;
            addOrbit(id); update();
        }
    }

    function buySkin(id, cost) {
        if (state.ownedSkins.includes(id)) { state.currentSkin = id; }
        else if (state.cells >= cost) {
            state.cells -= cost; state.ownedSkins.push(id); state.currentSkin = id;
        }
        update();
    }

    function buyDim(id, cost, cls) {
        if (state.ownedDims.includes(id)) { state.currentDim = id; }
        else if (state.cells >= cost) {
            state.cells -= cost; state.ownedDims.push(id); state.currentDim = id;
        }
        update();
    }

    function update() {
        let b = 1 + (state.prestige * 0.25);
        document.getElementById('score').innerText = Math.floor(state.cells).toLocaleString();
        document.getElementById('bps').innerText = (state.auto * state.mult * b).toFixed(1);
        document.getElementById('big-brain').innerText = state.currentSkin;
        document.getElementById('pres-val').innerText = state.prestige;
        
        // Update BG
        const dObj = config.dims.find(d => d.id === state.currentDim);
        document.getElementById('main-bg').className = 'click-area ' + dObj.class;
        document.getElementById('dim-name').innerText = dObj.name;

        // Render Items
        let h = '';
        for (let id in config.items) {
            let p = Math.floor(config.items[id].base * Math.pow(1.15, state.items[id]));
            h += `<div class="shop-item ${state.cells < p ? 'disabled' : ''}" onclick="buyItem('${id}')">
                <b>${config.items[id].name} (x${state.items[id]})</b><br>
                <small>Cost: ${p} | +${config.items[id].p}/s</small>
            </div>`;
        }
        document.getElementById('shop-container').innerHTML = h;

        // Render Skins
        let sh = '';
        config.skins.forEach(s => {
            let owned = state.ownedSkins.includes(s.id);
            sh += `<div class="shop-item" onclick="buySkin('${s.id}', ${s.cost})">
                <span style="font-size: 24px;">${s.id}</span> 
                <small>${owned ? 'EQUIP' : 'Buy: ' + s.cost}</small>
            </div>`;
        });
        document.getElementById('skin-container').innerHTML = sh;

        // Render Dims
        let dh = '';
        config.dims.forEach(d => {
            let owned = state.ownedDims.includes(d.id);
            dh += `<div class="shop-item" onclick="buyDim('${d.id}', ${d.cost}, '${d.class}')">
                <b>${d.name}</b><br>
                <small>${owned ? 'TELEPORT' : 'Buy: ' + d.cost}</small>
            </div>`;
        });
        document.getElementById('dim-container').innerHTML = dh;

        localStorage.setItem('neu_multiverse_v1', JSON.stringify(state));
    }

    function addOrbit(id) {
        const el = document.createElement('div'); el.className = 'orbit-item'; el.innerText = config.items[id].icon;
        el.style.setProperty('--dist', config.items[id].d + 'px'); el.style.setProperty('--speed', (Math.random() * 5 + 4) + 's');
        document.getElementById('orbit-container').appendChild(el);
    }

    function playCoinflip() {
        let b = parseInt(document.getElementById('bet-val').value);
        if (b > 0 && b <= state.cells) {
            state.cells -= b;
            if (Math.random() > 0.5) state.cells += b * 2;
            update();
        }
    }

    function toggleCasino(s) { document.getElementById('casino-overlay').classList.toggle('hidden', !s); }

    setInterval(() => {
        if (state.auto > 0) { state.cells += (state.auto * state.mult * (1 + state.prestige * 0.25)) / 10; update(); }
    }, 100);

    document.getElementById('big-brain').onclick = doClick;
    for (let id in state.items) { for(let i=0; i<state.items[id]; i++) addOrbit(id); }
    update();
</script>
</body>
</html>
