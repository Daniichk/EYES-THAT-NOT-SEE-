<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math & Cookie Universe | Persistence</title>
    <style>
        :root { --bg: #050508; --accent: #00ffcc; --gold: #e1b12c; --red: #ff4d4d; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }

        /* --- MATH SECTIONS --- */
        section { height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; position: relative; border-bottom: 1px solid rgba(0,255,204,0.1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .content { z-index: 10; text-align: center; background: rgba(5,5,8,0.85); padding: 30px; border-radius: 12px; border: 1px solid rgba(0,255,204,0.2); backdrop-filter: blur(10px); }
        h2 { font-weight: 100; font-size: 2rem; letter-spacing: 10px; color: var(--accent); margin: 0; }

        /* --- COOKIE CLICKER OVERLAY --- */
        #game-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: none;
            grid-template-columns: 350px 1fr 350px;
        }

        .left-panel { background: radial-gradient(circle, #333 0%, #000 100%); border-right: 3px solid #444; display: flex; flex-direction: column; align-items: center; position: relative; }
        #cookie-container { position: relative; width: 250px; height: 250px; margin-top: 80px; display: flex; align-items: center; justify-content: center; }
        #big-cookie { font-size: 100px; cursor: pointer; user-select: none; z-index: 5; transition: 0.05s; }
        #big-cookie:active { transform: scale(0.9); }
        
        .orbit-cursor { position: absolute; font-size: 20px; pointer-events: none; animation: click-pulse 1s infinite; }
        @keyframes click-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        /* CONTROL BUTTONS */
        .controls { margin-top: auto; padding-bottom: 30px; display: flex; gap: 10px; }
        .btn { padding: 8px 20px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; font-size: 0.7rem; letter-spacing: 2px; transition: 0.3s; }
        .btn:hover { background: var(--accent); color: #000; }
        .btn-red { border-color: var(--red); color: var(--red); }
        .btn-red:hover { background: var(--red); color: #fff; }

        /* RIGHT: STORE */
        .right-panel { background: #1a1a1a; overflow-y: auto; border-left: 3px solid #444; }
        .building { display: flex; align-items: center; padding: 12px; background: #222; border-bottom: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .building:hover { background: #2a2a2a; }
        .b-icon { font-size: 1.5rem; margin-right: 15px; width: 40px; text-align: center; }
        .b-cost { color: #00ffcc; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- MATH SECTIONS -->
    <section id="s1"><canvas id="c1"></canvas><div class="content"><h2>01. SINE</h2><p>Trig oscillation</p></div></section>
    <section id="s2"><canvas id="c2"></canvas><div class="content"><h2>02. VECTORS</h2><p>Gradient flow</p></div></section>

    <div id="game-overlay">
        <div class="left-panel">
            <div style="margin-top: 20px; text-align: center;">
                <div id="cookies-count" style="font-size: 1.8rem; font-weight: bold;">0 cookies</div>
                <div id="cps-display" style="color: #00ffcc;">per second: 0</div>
            </div>
            <div id="cookie-container">
                <div id="big-cookie">🍪</div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="saveGame()">SAVE PROGRESS</button>
                <button class="btn btn-red" onclick="resetGame()">RESET</button>
            </div>
            <p style="font-size: 0.6rem; color: #444; margin-bottom: 10px;">Progress is stored in your browser</p>
        </div>

        <div style="background: #111; border-right: 3px solid #444; padding: 20px;">
            <div style="padding: 10px; background: #000; text-align: center; font-size: 0.8rem; color: #666; border: 1px solid #222;">SYSTEM LOG: Memory initialized.</div>
        </div>

        <div class="right-panel">
            <div style="padding: 15px; text-align: center; font-weight: bold; border-bottom: 2px solid #333; background: #000;">STORE</div>
            <div id="store-items"></div>
            <p style="text-align: center; color: #444; font-size: 0.6rem; padding: 10px;">SPACE to Click | ESC to Exit</p>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let cookies = 0; 
        let cps = 0;
        let buildings = [
            { id: 'cur', name: 'Cursor', baseCost: 15, cost: 15, power: 0.1, icon: '🖱️', count: 0 },
            { id: 'grm', name: 'Grandma', baseCost: 100, cost: 100, power: 1, icon: '👵', count: 0 },
            { id: 'frm', name: 'Farm', baseCost: 1100, cost: 1100, power: 8, icon: '🌾', count: 0 },
            { id: 'mne', name: 'Mine', baseCost: 12000, cost: 12000, power: 47, icon: '⛏️', count: 0 },
            { id: 'fac', name: 'Factory', baseCost: 130000, cost: 130000, power: 260, icon: '🏭', count: 0 },
            { id: 'bnk', name: 'Bank', baseCost: 1400000, cost: 1400000, power: 1400, icon: '🏦', count: 0 }
        ];

        // --- SAVE/LOAD SYSTEM ---
        function saveGame() {
            const gameData = {
                cookies: cookies,
                buildings: buildings
            };
            localStorage.setItem('mathCookieSave', JSON.stringify(gameData));
            alert("Progress Saved!");
        }

        function loadGame() {
            const savedData = localStorage.getItem('mathCookieSave');
            if (savedData) {
                const data = JSON.parse(savedData);
                cookies = data.cookies;
                // Синхронизируем здания
                data.buildings.forEach((savedB, index) => {
                    if(buildings[index]) {
                        buildings[index].count = savedB.count;
                        buildings[index].cost = savedB.cost;
                    }
                });
                // Восстанавливаем визуальные курсоры
                const cursorCount = buildings.find(b => b.id === 'cur').count;
                for(let i=0; i<cursorCount; i++) addVisualCursor(true);
                
                calculateCPS();
                updateUI();
            }
        }

        function resetGame() {
            if(confirm("Delete all cookies and progress?")) {
                localStorage.removeItem('mathCookieSave');
                location.reload();
            }
        }

        // --- CORE ENGINE ---
        function updateUI() {
            document.getElementById('cookies-count').innerText = Math.floor(cookies) + " cookies";
            document.getElementById('cps-display').innerText = "per second: " + cps.toFixed(1);
            document.getElementById('store-items').innerHTML = buildings.map(b => `
                <div class="building" onclick="buy('${b.id}')">
                    <div class="b-icon">${b.icon}</div>
                    <div><b>${b.name}</b><br><span class="b-cost">${Math.floor(b.cost)}</span></div>
                    <div style="margin-left:auto; opacity: 0.3; font-weight: bold;">${b.count}</div>
                </div>`).join('');
        }

        function buy(id) {
            const b = buildings.find(x => x.id === id);
            if (cookies >= b.cost) {
                cookies -= b.cost; 
                b.count++; 
                b.cost = Math.floor(b.cost * 1.15);
                if(id === 'cur') addVisualCursor();
                calculateCPS(); 
                updateUI();
            }
        }

        function addVisualCursor(isLoading = false) {
            const c = document.createElement('div');
            c.className = 'orbit-cursor';
            c.innerText = '🖱️';
            const angle = Math.random() * Math.PI * 2;
            const radius = 130;
            c.style.left = (125 + Math.cos(angle) * radius - 10) + 'px';
            c.style.top = (125 + Math.sin(angle) * radius - 10) + 'px';
            c.style.transform = `rotate(${angle + Math.PI/2}rad)`;
            document.getElementById('cookie-container').appendChild(c);
        }

        function calculateCPS() { 
            cps = buildings.reduce((a, b) => a + (b.count * b.power), 0); 
        }

        // Controls
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' && document.getElementById('game-overlay').style.display === 'grid') {
                e.preventDefault(); cookies++; updateUI();
            }
            if (e.ctrlKey && e.shiftKey && e.code === 'Digit6') document.getElementById('game-overlay').style.display = 'grid';
            if (e.key === 'Escape') document.getElementById('game-overlay').style.display = 'none';
        });

        document.getElementById('big-cookie').onclick = () => { cookies++; updateUI(); };
        setInterval(() => { cookies += cps / 10; updateUI(); }, 100);

        // Init
        loadGame();
        updateUI();

        // Simple Math BG
        const c1 = document.getElementById('c1'); const ctx1 = c1.getContext('2d');
        function draw() {
            c1.width = window.innerWidth; c1.height = window.innerHeight;
            ctx1.fillStyle = 'rgba(5,5,8,0.1)'; ctx1.fillRect(0,0,c1.width,c1.height);
            ctx1.strokeStyle = '#00ffcc'; ctx1.beginPath();
            for(let x=0; x<c1.width; x+=5) ctx1.lineTo(x, c1.height/2 + Math.sin(x*0.01 + Date.now()*0.002)*100);
            ctx1.stroke(); requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
