<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Matrix | 100 Advanced Modules</title>
    <style>
        :root {
            --bg: #000;
            --card: #111;
            --accent: #0a84ff;
            --secondary: #333;
        }
        body {
            background: var(--bg);
            color: #fff;
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        header {
            text-align: center;
            padding: 60px 0;
            border-bottom: 1px solid var(--secondary);
            margin-bottom: 40px;
        }
        header h1 { font-size: clamp(24px, 5vw, 48px); font-weight: 600; letter-spacing: -2px; }
        
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .module {
            background: var(--card);
            aspect-ratio: 1;
            border-radius: 12px;
            border: 1px solid var(--secondary);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .module:hover {
            border-color: var(--accent);
            transform: scale(1.02);
            z-index: 10;
        }
        .module-label {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 10px;
            color: var(--accent);
            font-family: monospace;
            z-index: 5;
        }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

<header>
    <h1>Neural Interaction Matrix</h1>
    <p style="color: #666;">Unit 01-100: Systematic Cognitive Stress Testing</p>
</header>

<div class="matrix-grid" id="matrix"></div>

<script>
    const matrix = document.getElementById('matrix');
    const colors = ['#0a84ff', '#30d158', '#ff375f', '#bf5af2', '#ff9f0a', '#64d2ff'];
    
    // Генерируем 100 модулей
    for (let i = 1; i <= 100; i++) {
        const div = document.createElement('div');
        div.className = 'module';
        div.innerHTML = `<div class="module-label">EXP_${i.toString().padStart(3, '0')}</div><canvas id="c${i}"></canvas>`;
        matrix.appendChild(div);
        
        initModule(i);
    }

    function initModule(id) {
        const canvas = document.getElementById(`c${id}`);
        const ctx = canvas.getContext('2d');
        let w, h;
        
        const resize = () => {
            w = canvas.width = canvas.offsetWidth;
            h = canvas.height = canvas.offsetHeight;
        };
        resize();

        const type = id % 10; // 10 разных типов поведения
        let frame = 0;
        let mouse = { x: -100, y: -100, active: false };

        canvas.onmousemove = (e) => { mouse.x = e.offsetX; mouse.y = e.offsetY; mouse.active = true; };
        canvas.onmouseleave = () => { mouse.active = false; };

        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = colors[id % colors.length];
            ctx.lineWidth = 1;

            switch(type) {
                case 0: // Waves
                    ctx.beginPath();
                    for(let x=0; x<w; x+=5) {
                        let y = h/2 + Math.sin(x*0.05 + frame*0.1) * (mouse.active ? 30 : 10);
                        ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                    break;
                
                case 1: // Particles
                    for(let j=0; j<5; j++) {
                        ctx.fillStyle = ctx.strokeStyle;
                        ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2);
                    }
                    break;

                case 2: // Orbital
                    let ang = frame * 0.05;
                    ctx.beginPath();
                    ctx.arc(w/2 + Math.cos(ang)*30, h/2 + Math.sin(ang)*30, 3, 0, 7);
                    ctx.fill();
                    break;

                case 3: // Grid Elastic
                    for(let x=20; x<w; x+=40) {
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.quadraticCurveTo(mouse.x, mouse.y, x, h);
                        ctx.stroke();
                    }
                    break;

                case 4: // Scanning line
                    let ly = (frame * 2) % h;
                    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(w, ly); ctx.stroke();
                    break;

                case 5: // DNA Helix
                    for(let y=10; y<h; y+=10) {
                        let x1 = w/2 + Math.sin(y*0.1 + frame*0.1) * 20;
                        let x2 = w/2 - Math.sin(y*0.1 + frame*0.1) * 20;
                        ctx.fillRect(x1, y, 2, 2); ctx.fillRect(x2, y, 2, 2);
                    }
                    break;

                case 6: // Noise
                    let imgData = ctx.createImageData(w, 20);
                    for(let i=0; i<imgData.data.length; i+=4) {
                        let v = Math.random()*255;
                        imgData.data[i]=imgData.data[i+1]=imgData.data[i+2]=v;
                        imgData.data[i+3]=50;
                    }
                    ctx.putImageData(imgData, 0, (frame%h));
                    break;

                case 7: // Gravity points
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, mouse.active ? 15 : 0, 0, 7);
                    ctx.stroke();
                    break;

                case 8: // Expanding circles
                    let r = (frame % 50);
                    ctx.beginPath(); ctx.arc(w/2, h/2, r, 0, 7); ctx.stroke();
                    break;

                case 9: // Vector field small
                    for(let x=10; x<w; x+=30) {
                        for(let y=10; y<h; y+=30) {
                            let a = Math.atan2(mouse.y - y, mouse.x - x);
                            ctx.beginPath(); ctx.moveTo(x, y);
                            ctx.lineTo(x + Math.cos(a)*10, y + Math.sin(a)*10); ctx.stroke();
                        }
                    }
                    break;
            }

            frame++;
            requestAnimationFrame(draw);
        }
        draw();
    }
</script>

</body>
</html>
