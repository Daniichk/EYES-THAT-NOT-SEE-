<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Math Concept - Study Guide</title>
    <script defer src="/_vercel/insights/script.js"></script> <!-- Vercel Analytics -->
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #f0f0f0; margin: 0; overflow: hidden; }
        /* Скучный математический вид */
        #math-ui { padding: 50px; color: #333; }
        .hidden { display: none !important; }

        /* Игровой интерфейс (Кликер) */
        #game-ui { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #1a1a1a; color: #00ff00; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #big-brain { font-size: 100px; cursor: pointer; user-select: none; transition: transform 0.1s; }
        #big-brain:active { transform: scale(0.9); }
        .stats { font-size: 24px; margin: 20px; }
        button { background: #333; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ВИД ДЛЯ УЧИТЕЛЯ -->
    <div id="math-ui">
        <h1>Теорема Пифагора и её применение</h1>
        <p>Для прямоугольного треугольника выполняется: a² + b² = c²...</p>
        <div id="calculator">
            <input type="number" placeholder="Сторона A">
            <input type="number" placeholder="Сторона B">
            <button onclick="alert('Результат вычислен в логах')">Вычислить гипотенузу</button>
        </div>
    </div>

    <!-- СКРЫТЫЙ КЛИКЕР -->
    <div id="game-ui" class="hidden">
        <div class="stats">Нервные клетки: <span id="score">0</span></div>
        <div id="big-brain">🫠</div>
        <div class="stats">Уровень клика: <span id="click-lvl">1</span></div>
        <button id="upgrade-btn">Купить "Кофе" (Цена: <span id="cost">10</span>)</button>
        <p style="font-size: 10px; color: #555;">Нажми Ctrl+Shift+6 чтобы спрятать</p>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('brain_score')) || 0;
        let power = parseInt(localStorage.getItem('brain_power')) || 1;
        let cost = parseInt(localStorage.getItem('brain_cost')) || 10;

        const mathUI = document.getElementById('math-ui');
        const gameUI = document.getElementById('game-ui');

        // Секретная комбинация Ctrl + Shift + 6
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === '6') {
                gameUI.classList.toggle('hidden');
                mathUI.classList.toggle('hidden');
                // Vercel Analytics custom event
                if (window.va) window.va('event', { name: 'secret_open' });
            }
        });

        // Логика кликера
        document.getElementById('big-brain').addEventListener('click', () => {
            score += power;
            updateDisplay();
            save();
        });

        document.getElementById('upgrade-btn').addEventListener('click', () => {
            if (score >= cost) {
                score -= cost;
                power++;
                cost = Math.floor(cost * 1.5);
                updateDisplay();
                save();
            }
        });

        function updateDisplay() {
            document.getElementById('score').innerText = score;
            document.getElementById('click-lvl').innerText = power;
            document.getElementById('cost').innerText = cost;
        }

        function save() {
            localStorage.setItem('brain_score', score);
            localStorage.setItem('brain_power', power);
            localStorage.setItem('brain_cost', cost);
        }

        updateDisplay();
    </script>
</body>
</html>
