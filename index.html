<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Journey | Ultimate Stash</title>
    <style>
        :root { --bg: #050508; --accent: #00ffcc; --gold: #e1b12c; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }

        /* --- MATH SECTIONS --- */
        section { height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; position: relative; border-bottom: 1px solid rgba(0,255,204,0.1); }
        canvas.math-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .content { z-index: 10; text-align: center; background: rgba(5, 5, 8, 0.85); padding: 35px; border-radius: 15px; border: 1px solid rgba(0,255,204,0.2); backdrop-filter: blur(15px); transition: 0.3s; }
        .content:hover { border-color: var(--accent); box-shadow: 0 0 30px rgba(0,255,204,0.2); }
        h2 { font-weight: 100; font-size: 2.2rem; letter-spacing: 12px; margin: 0; color: var(--accent); text-transform: uppercase; }

        /* --- OVERLAYS --- */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; }
        .game-frame { width: 100%; height: 100%; border: none; }
        .close-hint { position: absolute; top: 20px; right: 20px; color: #555; font-size: 0.7rem; z-index: 10001; cursor: pointer; letter-spacing: 2px; }

        .nav { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); z-index: 100; }
        .dot { width: 5px; height: 25px; background: rgba(0,255,204,0.1); margin: 10px 0; transition: 0.5s; }
    </style>
</head>
<body>

    <div class="nav" id="nav"></div>

    <!-- 10 MATH SECTIONS -->
    <section id="s1"><canvas id="c1" class="math-bg"></canvas><div class="content"><h2>01. SINE</h2><p>Trig oscillation</p></div></section>
    <section id="s2"><canvas id="c2" class="math-bg"></canvas><div class="content"><h2>02. VECTORS</h2><p>Gradient fields</p></div></section>
    <!-- Добавь здесь еще 8 секций s3-s10 -->

    <!-- GAME OVERLAYS -->
    <div id="cookie-overlay" class="overlay">
        <div class="close-hint" onclick="closeAll()">[ ESC TO EXIT ]</div>
        <iframe id="cookie-frame" class="game-frame"></iframe>
    </div>

    <div id="car-overlay" class="overlay" style="display:none; flex-direction:column; align-items:center; justify-content:center;">
        <div class="close-hint" onclick="closeAll()">[ ESC TO EXIT ]</div>
        <h2 style="color:var(--accent)">NEON RACER</h2>
        <div id="road" style="width:300px; height:400px; border:2px solid var(--accent); position:relative; overflow:hidden;">
            <div id="car" style="width:40px; height:70px; background:var(--accent); position:absolute; bottom:20px; left:130px; transition:0.1s;"></div>
        </div>
    </div>

    <script defer src="/_vercel/insights/script.js"></script>

    <script>
        const mouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

        // --- ГОРЯЧИЕ КЛАВИШИ ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey && e.shiftKey) {
                if (e.code === 'Digit6') openGame('cookie-overlay', 'cookie.html');
                if (e.code === 'Digit7') toggleOverlay('car-overlay', 'flex');
            }
            if (e.key === 'Escape') closeAll();
            
            // Управление машиной
            if (e.code === 'ArrowLeft') moveCar(-20);
            if (e.code === 'ArrowRight') moveCar(20);
        });

        function openGame(id, url) {
            const overlay = document.getElementById(id);
            const frame = document.getElementById('cookie-frame');
            if (frame && !frame.src.includes(url)) frame.src = url;
            overlay.style.display = 'block';
        }

        function toggleOverlay(id, type) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === type) ? 'none' : type;
        }

        function closeAll() {
            document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
        }

        let carPos = 130;
        function moveCar(offset) {
            carPos = Math.max(0, Math.min(260, carPos + offset));
            const car = document.getElementById('car');
            if (car) car.style.left = carPos + 'px';
        }

        // --- МАТЕМАТИЧЕСКАЯ АНИМАЦИЯ (Светлее и интерактивнее) ---
        function initMath(id, i) {
            const c = document.getElementById(id); if (!c) return;
            const ctx = c.getContext('2d');
            const loop = () => {
                c.width = window.innerWidth; c.height = window.innerHeight;
                const ry = mouse.y - c.getBoundingClientRect().top;
                ctx.fillStyle = 'rgba(5, 5, 8, 0.15)'; 
                ctx.fillRect(0, 0, c.width, c.height);
                
                // Эффект света
                const grad = ctx.createRadialGradient(mouse.x, ry, 0, mouse.x, ry, 300);
                grad.addColorStop(0, `rgba(0, 255, 204, 0.1)`);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, c.width, c.height);

                ctx.strokeStyle = `hsl(${160 + i*10}, 100%, 50%)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for(let x=0; x<c.width; x+=10) {
                    let y = c.height/2 + Math.sin(x*0.01 + Date.now()*0.002) * (ry * 0.15);
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
                requestAnimationFrame(loop);
            };
            loop();
        }

        for(let i=1; i<=10; i++) initMath('c'+i, i);

        // Навигация
        const nav = document.getElementById('nav');
        for(let i=0; i<10; i++) nav.innerHTML += `<div class="dot" id="d${i+1}"></div>`;
        window.addEventListener('scroll', () => {
            let idx = Math.floor((window.scrollY + 300) / window.innerHeight);
            document.querySelectorAll('.dot').forEach((d,i) => d.style.background = i<=idx ? '#00ffcc' : 'rgba(0,255,204,0.1)');
        });
    </script>
</body>
</html>
