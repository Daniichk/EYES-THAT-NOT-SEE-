<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Zen Journey</title>
    <style>
        :root {
            --bg: #080808;
            --accent: #64ffda;
            --text: #a0a0b0;
        }

        body, html {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        section {
            height: 100vh;
            width: 100vw;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content {
            z-index: 2;
            text-align: center;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        h2 {
            font-weight: 200;
            letter-spacing: 10px;
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
        }

        p {
            font-style: italic;
            opacity: 0.6;
        }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            animation: bounce 2s infinite;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <!-- Секция 1: Trigonometry (Синусоида) -->
    <section id="trig">
        <canvas id="canvasTrig"></canvas>
        <div class="content">
            <h2>Trigonometry</h2>
            <p>The rhythm of the unit circle.</p>
        </div>
        <div class="scroll-hint">SCROLL DOWN ↓</div>
    </section>

    <!-- Секция 2: Calculus (Векторное поле) -->
    <section id="calculus">
        <canvas id="canvasCalc"></canvas>
        <div class="content">
            <h2>Calculus</h2>
            <p>Change is the only constant.</p>
        </div>
        <div class="scroll-hint">KEEP GOING ↓</div>
    </section>

    <!-- Секция 3: Geometry (Фрактальное дыхание) -->
    <section id="geometry">
        <canvas id="canvasGeo"></canvas>
        <div class="content">
            <h2>Infinity</h2>
            <p>Fractal patterns in the void.</p>
        </div>
    </section>

    <!-- Vercel Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>

    <script>
        // Общие настройки
        const mouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // --- СЕКЦИЯ 1: TRIGONOMETRY ---
        const c1 = document.getElementById('canvasTrig');
        const ctx1 = c1.getContext('2d');
        function initTrig() {
            c1.width = window.innerWidth;
            c1.height = window.innerHeight;
        }
        function drawTrig() {
            ctx1.fillStyle = 'rgba(8, 8, 8, 0.1)';
            ctx1.fillRect(0, 0, c1.width, c1.height);
            ctx1.beginPath();
            ctx1.strokeStyle = '#64ffda';
            let speed = Date.now() * 0.002;
            for(let x = 0; x < c1.width; x += 5) {
                let y = c1.height/2 + Math.sin(x * 0.005 + speed) * (mouse.y * 0.2);
                ctx1.lineTo(x, y);
            }
            ctx1.stroke();
            requestAnimationFrame(drawTrig);
        }

        // --- СЕКЦИЯ 2: CALCULUS (Particles) ---
        const c2 = document.getElementById('canvasCalc');
        const ctx2 = c2.getContext('2d');
        let particles = [];
        function initCalc() {
            c2.width = window.innerWidth;
            c2.height = window.innerHeight;
            particles = [];
            for(let i=0; i<100; i++) particles.push({x: Math.random()*c2.width, y: Math.random()*c2.height, vx: Math.random()-0.5, vy: Math.random()-0.5});
        }
        function drawCalc() {
            ctx2.fillStyle = 'rgba(8, 8, 8, 0.05)';
            ctx2.fillRect(0, 0, c2.width, c2.height);
            ctx2.fillStyle = '#fff';
            particles.forEach(p => {
                let dx = mouse.x - p.x;
                let dy = (mouse.y - (window.innerHeight)) - p.y; // Коррекция на скролл
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 200) {
                    p.vx += dx/1000;
                    p.vy += dy/1000;
                }
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > c2.width) p.vx *= -1;
                if(p.y < 0 || p.y > c2.height) p.vy *= -1;
                ctx2.fillRect(p.x, p.y, 2, 2);
            });
            requestAnimationFrame(drawCalc);
        }

        // --- СЕКЦИЯ 3: GEOMETRY (Spiral) ---
        const c3 = document.getElementById('canvasGeo');
        const ctx3 = c3.getContext('2d');
        function initGeo() {
            c3.width = window.innerWidth;
            c3.height = window.innerHeight;
        }
        function drawGeo() {
            ctx3.fillStyle = 'rgba(8, 8, 8, 0.05)';
            ctx3.fillRect(0, 0, c3.width, c3.height);
            ctx3.save();
            ctx3.translate(c3.width/2, c3.height/2);
            ctx3.rotate(Date.now() * 0.0005);
            for(let i=0; i<60; i++) {
                ctx3.strokeStyle = `rgba(100, 255, 218, ${1 - i/60})`;
                ctx3.strokeRect(-i*5, -i*5, i*10, i*10);
                ctx3.rotate(Math.PI / 20 + (mouse.x * 0.00001));
            }
            ctx3.restore();
            requestAnimationFrame(drawGeo);
        }

        window.addEventListener('resize', () => { initTrig(); initCalc(); initGeo(); });
        initTrig(); drawTrig();
        initCalc(); drawCalc();
        initGeo(); drawGeo();
    </script>
</body>
</html>
