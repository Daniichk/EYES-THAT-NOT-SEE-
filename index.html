<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neural Relaxation | Apple R&D</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --accent: #0a84ff;
            --secondary: #2c2c2e;
            --text: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 40px;
            display: flex; flex-direction: column; align-items: center;
        }
        header { text-align: left; width: 100%; max-width: 1200px; margin-bottom: 60px; }
        h1 { font-size: 40px; font-weight: 600; letter-spacing: -1px; margin: 0; }
        p { color: #8e8e93; font-size: 18px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }
        .module {
            background: var(--card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--secondary);
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .module:hover { border-color: var(--accent); transform: scale(1.02); }
        .label { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; opacity: 0.8; }
        canvas { background: #000; border-radius: 16px; width: 100%; height: 220px; cursor: none; }
    </style>
</head>
<body>

<header>
    <h1>Aesthetic Neural Study</h1>
    <p>Calibrating sensory response through interactive minimalism.</p>
</header>

<div class="grid" id="zen-grid"></div>

<script>
const grid = document.getElementById('zen-grid');

const zenExperiments = [
    { n: "Liquid Silk", f: (ctx, w, h, t, m) => {
        ctx.beginPath(); ctx.strokeStyle = "#5e5ce6"; ctx.lineWidth = 3;
        for(let x=0; x<w; x+=2) {
            let d = Math.abs(x - m.x);
            let y = h/2 + Math.sin(x*0.02 + t) * (20 + (60/(d/10+1)));
            if(x===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }},
    { n: "Bioluminescence", f: (ctx, w, h, t, m) => {
        let grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 80);
        grad.addColorStop(0, "rgba(10, 132, 255, 0.4)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
        for(let i=0; i<10; i++) {
            ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.3;
            ctx.fillRect(Math.random()*w, Math.random()*h, 1, 1);
        }
    }},
    { n: "Star Drift", f: (ctx, w, h, t, m) => {
        ctx.translate(w/2, h/2);
        for(let i=0; i<50; i++) {
            let r = (i*5 + t*20) % (w/2);
            let ang = i * 0.5;
            ctx.fillStyle = "#fff";
            ctx.fillRect(Math.cos(ang)*r, Math.sin(ang)*r, 1.5, 1.5);
        }
    }},
    { n: "Soft Aurora", f: (ctx, w, h, t, m) => {
        for(let i=0; i<3; i++) {
            ctx.beginPath();
            ctx.strokeStyle = i === 0 ? "#0a84ff" : "#5e5ce6";
            ctx.globalAlpha = 0.2; ctx.lineWidth = 40;
            ctx.moveTo(0, h/2 + Math.sin(t+i)*30);
            ctx.bezierCurveTo(w/3, h/2 + Math.cos(t)*50, w/1.5, h/2 - Math.sin(t)*50, w, h/2 + Math.sin(t+i)*30);
            ctx.stroke();
        }
    }},
    { n: "Magnetic Sand", f: (ctx, w, h, t, m) => {
        for(let i=0; i<400; i+=20) {
            for(let j=0; j<220; j+=20) {
                let dx = m.x - i, dy = m.y - j;
                let dist = Math.sqrt(dx*dx+dy*dy);
                ctx.fillStyle = "#444";
                ctx.fillRect(i + dx/dist*5, j + dy/dist*5, 2, 2);
            }
        }
    }},
    { n: "Floating Nebulae", f: (ctx, w, h, t, m) => {
        ctx.globalAlpha = 0.5;
        for(let i=0; i<3; i++) {
            ctx.beginPath();
            ctx.arc(w/2 + Math.cos(t+i)*40, h/2 + Math.sin(t*0.5+i)*20, 30+i*10, 0, 7);
            ctx.fillStyle = i % 2 === 0 ? "#30d158" : "#0a84ff";
            ctx.filter = "blur(20px)"; ctx.fill();
        }
    }},
    { n: "Echo Ripples", f: (ctx, w, h, t, m) => {
        for(let i=0; i<5; i++) {
            let r = (t*40 + i*40) % 150;
            ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 7);
            ctx.strokeStyle = `rgba(255,255,255, ${1 - r/150})`; ctx.stroke();
        }
    }},
    { n: "Golden Ratio Rain", f: (ctx, w, h, t, m) => {
        ctx.fillStyle = "#ffd60a";
        for(let i=0; i<20; i++) {
            let x = (i * 137.5) % w;
            let y = (t * 60 + i * 20) % h;
            ctx.fillRect(x, y, 1, 10);
        }
    }},
    { n: "Orbital Harmony", f: (ctx, w, h, t, m) => {
        ctx.strokeStyle = "#38383a";
        ctx.beginPath(); ctx.arc(w/2, h/2, 60, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.arc(w/2 + Math.cos(t)*60, h/2 + Math.sin(t)*60, 8, 0, 7);
        ctx.fillStyle = "#ff375f"; ctx.fill();
    }},
    { n: "Elastic Horizon", f: (ctx, w, h, t, m) => {
        ctx.beginPath(); ctx.moveTo(0, h/2);
        ctx.quadraticCurveTo(m.x, m.y, w, h/2);
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    }}
];

zenExperiments.forEach((exp, i) => {
    const card = document.createElement('div');
    card.className = 'module';
    card.innerHTML = `<div class="label">Unit ${String(i+1).padStart(2,'0')} // ${exp.n}</div><canvas id="z${i}"></canvas>`;
    grid.appendChild(card);

    const canvas = document.getElementById(`z${i}`);
    const ctx = canvas.getContext('2d');
    let mouse = { x: 170, y: 110 };

    canvas.onmousemove = (e) => { mouse.x = e.offsetX; mouse.y = e.offsetY; };

    function render(time) {
        canvas.width = canvas.offsetWidth;
        canvas.height = 220;
        ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.save();
        exp.f(ctx, canvas.width, canvas.height, time/1000, mouse);
        ctx.restore();
        requestAnimationFrame(render);
    }
    render(0);
});
</script>

</body>
</html>
