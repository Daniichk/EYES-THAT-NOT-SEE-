<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Analytics Module</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <!-- Math Mask -->
    <div id="math-ui">
        <h1>Unit 14: Probability Theory</h1>
        <div class="formula">P(A|B) = [P(B|A) * P(A)] / P(B)</div>
        <p>Bayes' theorem describes the probability of an event, based on prior knowledge...</p>
        <p class="hint">Press [ESC] to toggle focus mode.</p>
    </div>

    <!-- Main Game -->
    <div id="game-ui" class="hidden">
        <div class="click-area" id="main-bg">
            <div id="big-brain">🫠</div>
            <div class="hud">
                <h2 id="dim-label">CYBER CORE</h2>
                <small>Diplomas: <span id="pres-val">0</span></small>
            </div>
        </div>

        <div class="sidebar">
            <div class="stat-card">
                <div class="stat-val" id="score">0</div>
                <div class="bps-label">+<span id="bps">0</span>/sec</div>
            </div>

            <button class="daily-btn" onclick="claimDaily()">🎁 DAILY BONUS</button>

            <div class="tabs">
                <button class="tab-btn active" data-tab="shop">SHOP</button>
                <button class="tab-btn" data-tab="skins">SKINS</button>
                <button class="tab-btn" data-tab="dims">WORLDS</button>
                <button class="tab-btn danger" onclick="toggleCasino(true)">🎰 GAMES</button>
            </div>

            <div id="tab-shop" class="tab-content"></div>
            <div id="tab-skins" class="tab-content hidden"></div>
            <div id="tab-dims" class="tab-content hidden"></div>
        </div>
    </div>

    <!-- Casino Overlay -->
    <div id="casino-overlay" class="hidden">
        <div class="modal">
            <h2 id="cas-title">NEURAL CASINO</h2>
            
            <div id="cas-lobby">
                <input type="number" id="bet-val" placeholder="Enter Bet...">
                <div class="quick-bets">
                    <button onclick="setBet(0.1)">10%</button>
                    <button onclick="setBet(0.5)">50%</button>
                    <button onclick="setBet(1)">ALL IN</button>
                </div>
                <div class="game-grid">
                    <button onclick="enterGame('tower')">🏗️ TOWER</button>
                    <button onclick="enterGame('roulette')">🎡 ROULETTE</button>
                    <button onclick="enterGame('bj')">🃏 BLACKJACK</button>
                </div>
                <button class="exit-btn" onclick="toggleCasino(false)">EXIT</button>
            </div>

            <div id="cas-tower" class="hidden">
                <div id="t-visual"></div>
                <div class="mult-display" id="t-mult">x1.0</div>
                <button class="cas-action success" onclick="towerBuild()">BUILD</button>
                <button class="cas-action danger" onclick="towerCashOut()">CASH OUT</button>
            </div>

            <div id="cas-roulette" class="hidden">
                <div class="r-wrap"><div id="r-track"></div><div class="r-pin"></div></div>
                <div class="r-btns">
                    <button class="r-red" onclick="spinR('red')">RED x2</button>
                    <button class="r-black" onclick="spinR('black')">BLACK x2</button>
                    <button class="r-green" onclick="spinR('green')">GREEN x14</button>
                </div>
            </div>

            <div id="cas-bj" class="hidden">
                <div class="bj-zone dealer">Dealer: <span id="bj-d-score">?</span><div id="bj-d-cards"></div></div>
                <div class="bj-zone player">You: <span id="bj-p-score">0</span><div id="bj-p-cards"></div></div>
                <div id="bj-ctrls">
                    <button class="cas-action" onclick="bjAction('hit')">HIT</button>
                    <button class="cas-action" onclick="bjAction('stand')">STAND</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="casino.js"></script>
</body>
</html>
