<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyes That Do Not See | English Project</title>
    <style>
        :root {
            --primary: #0a0b10;
            --accent: #3498db;
            --text-light: #f4f4f9;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: var(--primary);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 50px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 5px;
            letter-spacing: 5px;
            color: var(--accent);
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 40px;
            opacity: 0.7;
            letter-spacing: 1px;
        }
        .team-section {
            margin: 30px 0;
            padding: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .team-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            font-size: 1.2rem;
            margin-top: 15px;
        }
        .member {
            color: #bdc3c7;
            font-weight: 300;
        }
        .description {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #dcdde1;
            margin-bottom: 20px;
        }
        .footer-note {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Eyes That Do Not See</h1>
    <p class="subtitle">English Project </p>

    <div class="description">
        <p>In this project, we had to make the video like influencer about nutrition</p>
        
    </div>

    <div class="team-section">
        <div class="team-grid">
            <div class="member">Alex Gomez Lobo</div>
            <div class="member">Pablo Ferriol Pareja</div>
            <div class="member">Vicente Linguesa</div>
            <div class="member">Daniil Derzhakov</div>
        </div>
    </div>

    <p class="footer-note">Access Restricted - Project Simulation encrypted</p>
</div>

<script>
    // Secret Keybind Logic: Ctrl + Shift + 6
    window.addEventListener('keydown', function(e) {
        // We check for Ctrl (e.ctrlKey), Shift (e.shiftKey) and the key "6"
        if (e.ctrlKey && e.shiftKey && e.key === '6') {
            window.location.href = 'game.html';
        }
    });
</script>

</body>
</html>
