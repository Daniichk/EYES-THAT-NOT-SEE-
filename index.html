<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Interactive Math Zen</title>
    <style>
        body, html { margin: 0; padding: 0; background: #0b0e14; color: #64ffda; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100%; }
        canvas { display: block; }
        .ui {
            position: absolute;
            top: 40px;
            left: 40px;
            pointer-events: none;
            max-width: 400px;
        }
        h1 { font-weight: 200; font-size: 2rem; letter-spacing: 5px; margin: 0; opacity: 0.8; }
        p { color: #a0a0b0; line-height: 1.6; font-size: 0.9rem; margin-top: 10px; }
        .hint { position: absolute; bottom: 30px; width: 100%; text-align: center; color: #444; font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="ui">
        <h1>MATH VISUALIZED</h1>
        <p>Explore the harmony between <b>Calculus</b> and <b>Trigonometry</b>. <br>Move your cursor to alter the function's derivatives.</p>
    </div>

    <canvas id="canvas"></canvas>
    
    <div class="hint">MOVE MOUSE TO INTERACT</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let mouseX = 0, mouseY = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        resize();

        function draw() {
            ctx.fillStyle = 'rgba(11, 14, 20, 0.1)'; // Эффект шлейфа
            ctx.fillRect(0, 0, width, height);

            ctx.beginPath();
            ctx.strokeStyle = '#64ffda';
            ctx.lineWidth = 2;

            const amplitude = (height / 4) * (mouseY / height + 0.2);
            const frequency = 0.01 * (mouseX / width * 5 + 1);

            for (let x = 0; x < width; x++) {
                // Тригонометрическая функция (Синус)
                const y = height / 2 + Math.sin(x * frequency + Date.now() * 0.002) * amplitude;
                
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Визуализация "производной" в точке мыши
            const dotY = height / 2 + Math.sin(mouseX * frequency + Date.now() * 0.002) * amplitude;
            ctx.beginPath();
            ctx.arc(mouseX, dotY, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
