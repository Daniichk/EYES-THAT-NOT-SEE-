<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math & Cookies | Pro Experience</title>
    <style>
        :root { --bg: #050508; --accent: #00ffcc; --gold: #e1b12c; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }

        /* ОСНОВНОЙ ГЕЙМПЛЕЙНЫЙ ОВЕРЛЕЙ */
        #game-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: none;
            grid-template-columns: 300px 1fr 300px;
            border: 5px solid #444; box-sizing: border-box;
        }

        /* КОЛОНКА 1: ПЕЧЕНЬКА */
        .left-panel {
            background: radial-gradient(circle, #444 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            border-right: 4px solid #555; text-align: center;
        }
        #big-cookie {
            width: 200px; height: 200px; font-size: 100px;
            background: #6d4c41; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); transition: transform 0.05s;
            user-select: none; margin-top: 50px; border: 8px solid #4e342e;
        }
        #big-cookie:active { transform: scale(0.95); }
        .score-box { background: rgba(0,0,0,0.5); padding: 10px; width: 100%; margin-top: 20px; border-radius: 5px; }
        #cookies-count { font-size: 1.4rem; font-weight: bold; color: #fff; }

        /* КОЛОНКА 2: ИНФО */
        .mid-panel {
            background: #111; overflow-y: auto; display: flex; flex-direction: column;
            border-right: 4px solid #555;
        }
        .news-ticker { background: #000; padding: 10px; text-align: center; font-size: 0.8rem; border-bottom: 2px solid #333; color: #aaa; }
        .game-canvas-area { flex-grow: 1; position: relative; background: #0a0a0a; border: 10px solid #222; margin: 10px; }

        /* КОЛОНКА 3: МАГАЗИН (BUILDINGS) */
        .right-panel { background: #222; overflow-y: auto; padding: 0; }
        .store-header { background: #000; padding: 10px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .building {
            display: flex; align-items: center; padding: 10px;
            background: #333; border-bottom: 1px solid #444; cursor: pointer;
            transition: 0.2s; position: relative;
        }
        .building:hover { background: #444; }
        .building.locked { opacity: 0.5; filter: grayscale(1); }
        .b-icon { font-size: 1.5rem; margin-right: 15px; width: 40px; text-align: center; }
        .b-info { display: flex; flex-direction: column; }
        .b-name { font-weight: bold; font-size: 0.9rem; }
        .b-cost { color: #64ffda; font-size: 0.8rem; }
        .b-count { position: absolute; right: 15px; font-size: 1.2rem; opacity: 0.3; font-weight: bold; }

        /* МАТЕМАТИЧЕСКИЕ СЕКЦИИ */
        section { height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
        .content { z-index: 10; text-align: center; background: rgba(5,5,8,0.8); padding: 20px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <!-- CLICKER OVERLAY -->
    <div id="game-overlay">
        <!-- Лево -->
        <div class="left-panel">
            <div style="font-size: 0.7rem; opacity: 0.5;">Bakery Name</div>
            <div class="score-box">
                <div id="cookies-count">0 cookies</div>
                <div id="cps-display" style="font-size: 0.7rem; color: #888;">per second: 0</div>
            </div>
            <div id="big-cookie">🍪</div>
        </div>

        <!-- Центр -->
        <div class="mid-panel">
            <div class="news-ticker">News: Mathematical chocolate found in 4th dimension!</div>
            <div class="game-canvas-area" id="visual-effects">
                <p style="padding: 20px; color: #444;">[ Visual Production Area ]</p>
            </div>
        </div>

        <!-- Право (Магазин) -->
        <div class="right-panel">
            <div class="store-header">Store</div>
            <div id="store-container"></div>
            <div style="padding: 10px; font-size: 0.6rem; color: #555; text-align: center;">Press ESC to return to Math</div>
        </div>
    </div>

    <!-- MATH CONTENT (Твои 10 секций) -->
    <section id="s1"><canvas id="c1"></canvas><div class="content"><h2>01. Sine</h2><p>Trig oscillation</p></div></section>
    <section id="s10" style="height: 900vh;"></section> <!-- Заглушка для прокрутки -->

    <script defer src="/_vercel/insights/script.js"></script>

    <script>
        // --- GAME LOGIC ---
        let cookies = 0;
        let cps = 0;
        const buildings = [
            { id: 'cursor', name: 'Cursor', cost: 15, power: 0.1, icon: '🖱️', count: 0 },
            { id: 'grandma', name: 'Grandma', cost: 100, power: 1, icon: '👵', count: 0 },
            { id: 'farm', name: 'Farm', cost: 1100, power: 8, icon: '🌾', count: 0 },
            { id: 'mine', name: 'Mine', cost: 12000, power: 47, icon: '⛏️', count: 0 },
            { id: 'factory', name: 'Factory', cost: 130000, power: 260, icon: '🏭', count: 0 }
        ];

        function initStore() {
            const container = document.getElementById('store-container');
            container.innerHTML = buildings.map(b => `
                <div class="building" onclick="buyBuilding('${b.id}')">
                    <div class="b-icon">${b.icon}</div>
                    <div class="b-info">
                        <span class="b-name">${b.name}</span>
                        <span class="b-cost" id="cost-${b.id}">${b.cost}</span>
                    </div>
                    <div class="b-count" id="count-${b.id}">0</div>
                </div>
            `).join('');
        }

        function buyBuilding(id) {
            const b = buildings.find(x => x.id === id);
            if (cookies >= b.cost) {
                cookies -= b.cost;
                b.count++;
                b.cost = Math.floor(b.cost * 1.15);
                updateUI();
                calculateCPS();
            }
        }

        function calculateCPS() {
            cps = buildings.reduce((acc, b) => acc + (b.count * b.power), 0);
        }

        function updateUI() {
            document.getElementById('cookies-count').innerText = Math.floor(cookies) + " cookies";
            document.getElementById('cps-display').innerText = "per second: " + cps.toFixed(1);
            buildings.forEach(b => {
                document.getElementById(`cost-${b.id}`).innerText = b.cost;
                document.getElementById(`count-${b.id}`).innerText = b.count;
            });
        }

        // Таймер авто-кликов
        setInterval(() => {
            cookies += cps / 10;
            updateUI();
        }, 100);

        document.getElementById('big-cookie').onclick = () => { cookies++; updateUI(); };

        // Управление оверлеем
        window.addEventListener('keydown', e => {
            if (e.ctrlKey && e.shiftKey && e.code === 'Digit6') {
                document.getElementById('game-overlay').style.display = 'grid';
            }
            if (e.key === 'Escape') document.getElementById('game-overlay').style.display = 'none';
        });

        initStore();

        // --- ТВОЯ МАТЕМАТИЧЕСКАЯ АНИМАЦИЯ (Пример для секции 1) ---
        const c1 = document.getElementById('c1');
        const ctx1 = c1.getContext('2d');
        function draw() {
            c1.width = window.innerWidth; c1.height = window.innerHeight;
            ctx1.fillStyle = 'rgba(5,5,8,0.1)'; ctx1.fillRect(0,0,c1.width,c1.height);
            ctx1.strokeStyle = '#00ffcc'; ctx1.beginPath();
            for(let x=0; x<c1.width; x+=5) ctx1.lineTo(x, c1.height/2 + Math.sin(x*0.01 + Date.now()*0.002)*100);
            ctx1.stroke();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
