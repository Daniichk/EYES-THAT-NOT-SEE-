<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCI: Neural & Physical Interaction Study</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --accent: #0071e3;
            --gray: #86868b;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            margin: 0; padding: 40px 20px;
            display: flex; justify-content: center;
        }
        .container { max-width: 1000px; width: 100%; }
        header { margin-bottom: 40px; border-left: 4px solid var(--accent); padding-left: 20px; }
        h1 { font-size: 32px; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            display: flex; flex-direction: column;
        }
        .card h3 { font-size: 13px; color: var(--gray); text-transform: uppercase; margin: 0 0 15px 0; }
        canvas { background: #fbfbfd; border-radius: 12px; cursor: crosshair; width: 100%; height: 200px; }
        
        .wiki-link {
            margin-top: 15px;
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
        }
        .wiki-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Cognitive Ergonomics Research</h1>
        <p>Analyzing sensory feedback and physical interaction models.</p>
    </header>

    <div class="grid">
        <!-- M4: Rigid Body Physics -->
        <div class="card">
            <h3>M4: Collision & Mass Physics</h3>
            <canvas id="m4-canvas"></canvas>
            <a href="https://en.wikipedia.org" target="_blank" class="wiki-link">Theory: Rigid Body Dynamics →</a>
        </div>

        <!-- M9: Gravitational Wave -->
        <div class="card">
            <h3>M9: Wave Attenuation</h3>
            <canvas id="m9-canvas"></canvas>
            <a href="https://en.wikipedia.org" target="_blank" class="wiki-link">Theory: Superposition Principle →</a>
        </div>

        <!-- M2: Breathing -->
        <div class="card">
            <h3>M2: Pulse Synchronization</h3>
            <div style="height: 200px; display: flex; align-items: center; justify-content: center;">
                <div id="breath-circle" style="width: 60px; height: 60px; background: var(--accent); border-radius: 50%; transition: 3s transform ease-in-out;"></div>
            </div>
            <a href="https://en.wikipedia.org" target="_blank" class="wiki-link">Theory: Temporal Coherence →</a>
        </div>
    </div>
</div>

<script>
    // --- M4: Physics with Collisions ---
    const c4 = document.getElementById('m4-canvas');
    const ctx4 = c4.getContext('2d');
    c4.width = 300; c4.height = 200;
    let balls = [];

    class Ball {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.r = 10;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = 2;
            this.m = 1; // mass
        }
        draw() {
            ctx4.beginPath();
            ctx4.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx4.fillStyle = '#0071e3';
            ctx4.fill();
        }
        update() {
            this.vy += 0.2; // gravity
            this.x += this.vx;
            this.y += this.vy;

            // Wall collisions
            if (this.y + this.r > c4.height) { this.y = c4.height - this.r; this.vy *= -0.5; }
            if (this.x + this.r > c4.width || this.x - this.r < 0) { this.vx *= -0.8; }

            // Ball to Ball collisions
            balls.forEach(other => {
                if (other === this) return;
                let dx = other.x - this.x;
                let dy = other.y - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < this.r + other.r) {
                    // Simple "stacking" logic: push them apart
                    let angle = Math.atan2(dy, dx);
                    let targetX = this.x + Math.cos(angle) * (this.r + other.r);
                    let targetY = this.y + Math.sin(angle) * (this.r + other.r);
                    other.x = targetX;
                    other.y = targetY;
                    other.vy *= 0.5;
                    this.vy *= 0.5;
                }
            });
        }
    }

    c4.onclick = (e) => {
        const r = c4.getBoundingClientRect();
        balls.push(new Ball(e.clientX - r.left, e.clientY - r.top));
    };

    function loopM4() {
        ctx4.clearRect(0,0,300,200);
        balls.forEach(b => { b.update(); b.draw(); });
        requestAnimationFrame(loopM4);
    }
    loopM4();

    // --- M9: Wave + Cursor Gravitation ---
    const c9 = document.getElementById('m9-canvas');
    const ctx9 = c9.getContext('2d');
    c9.width = 300; c9.height = 200;
    let mx = -100, my = -100;

    c9.onmousemove = (e) => {
        const r = c9.getBoundingClientRect();
        mx = e.clientX - r.left; my = e.clientY - r.top;
    };

    let time = 0;
    function loopM9() {
        ctx9.clearRect(0,0,300,200);
        ctx9.beginPath();
        ctx9.strokeStyle = "#0071e3";
        ctx9.lineWidth = 2;
        for(let x=0; x<=300; x+=2) {
            let y = 100 + Math.sin(x*0.05 + time) * 20;
            let d = Math.abs(x - mx);
            if(d < 50) {
                let force = (50 - d) / 50;
                y += (my - y) * force;
            }
            if(x===0) ctx9.moveTo(x, y); else ctx9.lineTo(x, y);
        }
        ctx9.stroke();
        time += 0.05;
        requestAnimationFrame(loopM9);
    }
    loopM9();

    // M2: Breath circle interaction
    const circle = document.getElementById('breath-circle');
    circle.onmousedown = () => circle.style.transform = "scale(2.5)";
    circle.onmouseup = () => circle.style.transform = "scale(1)";
</script>

</body>
</html>
