<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational JS Interaction Lab</title>
    <style>
        /* Keeping it ugly but "educational" */
        body {
            background-color: #e0f7fa; 
            font-family: "Courier New", monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 5px solid #546e7a;
            padding: 20px;
            background: #ffffff;
        }
        h1 { color: #263238; }
        
        /* The button that moves or changes */
        #logic-btn {
            padding: 20px;
            font-size: 1.5rem;
            background-color: #ff5722;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 50%; /* It's a circle for no reason */
            width: 200px;
            height: 200px;
        }

        /* Moving text for that old-school feel */
        .scrolling-info {
            width: 100%;
            background: #263238;
            color: #81c784;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Interaction Study #1</h1>
        <p>This experiment measures user patience.</p>
        
        <button id="logic-btn">OBSERVE BUTTON</button>
        
        <h2 id="status-report">Patience Level: 100%</h2>
    </div>

    <div class="scrolling-info">
        <marquee scrollamount="10">LEARNING PROGRESS: 0% ... PROCESSING VACUUM ... DATA IS IRRELEVANT ...</marquee>
    </div>

    <script>
        const btn = document.getElementById('logic-btn');
        const status = document.getElementById('status-report');
        let clicks = 0;

        btn.addEventListener('click', () => {
            clicks++;
            
            // Stupid logic: button gets smaller every click
            let size = 200 - (clicks * 5);
            btn.style.width = size + 'px';
            btn.style.height = size + 'px';
            btn.style.fontSize = (1.5 - (clicks * 0.05)) + 'rem';

            if (size <= 10) {
                btn.innerText = "GONE";
                status.innerText = "Patience Level: 0%. You deleted the button.";
                btn.style.display = 'none';
            } else {
                status.innerText = `Patience Level: ${100 - clicks}%`;
                btn.innerText = "CLICKED";
                
                // Change color to something annoying
                btn.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            }

            console.log("Blocksi-friendly: Logic execution confirmed.");
        });
    </script>
</body>
</html>
